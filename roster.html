<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DFT Creator Roster</title>
<link rel="icon" type="image/png" href="https://digitalfoxtalent.com/dft/favicon.png">
<style>
  :root{
    color-scheme: light;
    --orange:#ff8800; --charcoal:#15110e; --peach:#fceedf; --namebg:#f9cb9c;
    --child:#4a4640; --grid:#e6d9c8; --muted:#8a7d70; --bg:#f4f1ec;
    --team:#2f5d8a; --teambg:#eaf1f8; --ok:#2f7d4f; --hide:#b23a2a;
    --font:"Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --rowh:36px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:var(--font); color:var(--charcoal); background:var(--bg); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:var(--font); }
  .app{ display:flex; flex-direction:column; height:100vh; }

  /* Toolbar */
  .toolbar{ display:flex; align-items:center; gap:10px; padding:12px 16px; background:#fff; border-bottom:1px solid #e9e0d3; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .mark img{ height:26px; width:auto; display:block; }
  .brand .t{ font-size:15px; font-weight:700; letter-spacing:-.2px; }
  .brand .s{ font-size:11px; color:var(--muted); font-weight:500; margin-top:1px; }
  .spacer{ flex:1; }
  .count{ font-size:11.5px; font-weight:600; color:var(--muted); }
  .search{ position:relative; }
  .search input{ font-family:var(--font); font-size:12.5px; color:var(--charcoal); border:1px solid #e4d8c7; background:#fff; border-radius:8px; padding:8px 12px 8px 31px; outline:none; width:220px; max-width:100%; }
  .search input:focus{ border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,136,0,.12); }
  .search svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .btn{ border:1px solid #e4d8c7; background:#fff; color:#a85f00; font-size:11.5px; font-weight:600; border-radius:8px; padding:7px 10px; cursor:pointer; white-space:nowrap; }
  .btn:hover{ background:#fff5ea; }
  .cpmall .cpmdisc{ display:flex; align-items:center; gap:6px; font-size:12px; margin:8px 0 2px; cursor:pointer; }
  .cpmall .cpmdisc input{ width:14px; height:14px; margin:0; accent-color:var(--orange); }
  .btn.sendpicks{ background:var(--orange); color:#fff; border-color:var(--orange); font-size:12.5px; padding:8px 14px; margin:8px 0 2px; align-self:flex-start; }
  .btn.sendpicks:hover{ background:var(--orange); filter:brightness(.94); }
  .btn.sendpicks:disabled{ opacity:.75; cursor:default; filter:none; }
  .btn.team{ color:var(--team); border-color:#c9d8e8; }
  .btn.team:hover{ background:var(--teambg); }
  .btn.primary{ background:var(--orange); border-color:var(--orange); color:var(--charcoal); }
  .btn.primary:hover{ background:#ff9a2e; }
  .signin{ font-size:11px; color:var(--muted); font-weight:600; }
  .signin:hover{ color:var(--charcoal); text-decoration:underline; }
  .seg{ display:inline-flex; border:1px solid #c9d8e8; border-radius:8px; overflow:hidden; }
  .seg button{ border:0; background:#fff; color:var(--team); font-size:11.5px; font-weight:600; padding:7px 10px; cursor:pointer; }
  .seg button.on{ background:var(--team); color:#fff; }

  /* Banner (team identity / saved list) */
  .banner{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 16px; font-size:12px; background:var(--teambg); color:var(--team); border-bottom:1px solid #d5e2ef; }
  .banner.list{ background:#fff5ea; color:#8a4a00; border-bottom-color:#f0dcc2; }
  .banner.warn{ background:#fff4d6; color:#6e4a00; border-bottom-color:#efd98f; }
  .banner .bbtn{ display:inline-block; border:1px solid currentColor; border-radius:7px; padding:3px 9px; font-weight:700; background:#fff; color:inherit; cursor:pointer; font-size:11.5px; text-decoration:none; }
  .banner .bbtn:hover{ background:#fffaf0; }
  #panel .hint{ font-size:11px; color:var(--muted); line-height:1.45; margin-top:10px; border-top:1px solid #eee3d4; padding-top:8px; }
  .banner b{ font-weight:700; }
  .banner .pkg{ margin-left:auto; display:flex; gap:14px; flex-wrap:wrap; font-weight:600; }
  .banner .pkg span b{ font-weight:800; color:#5a3000; }
  .banner.brandbar{ display:block; padding:18px 28px 20px; font-size:12.5px; line-height:1.5; }
  .brandbar .bb-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px 28px; flex-wrap:wrap; }
  .banner.listbar{ display:flex; align-items:center; justify-content:space-between; gap:12px 28px; flex-wrap:wrap; padding:14px 28px; font-size:12.5px; }
  .listbar .lb-acts{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .listbar .btn{ text-decoration:none; color:var(--team); border-color:#c9d8e8; }
  .listbar .pkg{ margin-left:0; gap:6px 22px; }
  .listbar .pkg span b{ color:var(--team); }
  .lseg{ display:inline-flex; align-items:center; border:1px solid #c9d8e8; border-radius:8px; overflow:hidden; background:#fff; font-size:11.5px; font-weight:600; }
  .lseg span{ padding:0 10px; color:var(--muted); }
  .lseg button{ border:0; border-left:1px solid #c9d8e8; background:#fff; color:var(--team); font:inherit; padding:7px 10px; cursor:pointer; }
  .lseg button.on{ background:var(--team); color:#fff; }
  .brandbar .pkg{ margin-left:0; gap:6px 24px; font-size:12.5px; }
  .brandbar .btn.sendpicks{ margin:0; align-self:center; font-size:13px; padding:10px 18px; border-radius:9px; }

  /* Pitch-list totals (saved lists only) */
  tfoot td{ position:sticky; bottom:0; z-index:2; background:#1a1a1a; color:#fff; font-weight:700; border-color:#333; }
  tfoot td.name{ z-index:3; background:#1a1a1a; text-align:left; }
  tfoot td .sub{ display:block; font-size:10px; font-weight:600; color:#ffb800; line-height:1.1; }

  /* Grid */
  .scroll{ flex:1; overflow:auto; background:#fff; }
  table{ border-collapse:separate; border-spacing:0; font-size:12.5px; table-layout:fixed; }
  th,td{ border-right:1px solid var(--grid); border-bottom:1px solid var(--grid); padding:0 10px; height:var(--rowh); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; vertical-align:middle; }
  thead th{ position:sticky; top:0; z-index:3; background:var(--orange); color:var(--charcoal); font-weight:600; box-shadow:0 1px 0 rgba(0,0,0,.06); cursor:pointer; user-select:none; }
  thead th:hover{ background:#ff9a2e; }
  thead th.tcol{ background:#d6e3f0; color:var(--team); }
  thead th.tcol:hover{ background:#c7d9eb; }
  thead th.dragging{ opacity:.45; }
  thead th.drop-l{ box-shadow: inset 3px 0 0 0 var(--charcoal); }
  thead th.drop-r{ box-shadow: inset -3px 0 0 0 var(--charcoal); }
  .rsz{ position:absolute; top:0; bottom:0; right:0; width:9px; cursor:col-resize; z-index:6; }
  .rsz::after{ content:""; position:absolute; top:6px; bottom:6px; right:2px; width:2px; border-radius:2px; background:transparent; }
  .rsz:hover::after, .rsz.on::after{ background:var(--charcoal); }
  body.resizing, body.resizing *{ cursor:col-resize !important; user-select:none !important; }
  .sortcar{ font-size:8px; margin-left:5px; vertical-align:middle; }
  .sortcar.dim{ opacity:0; }
  thead th.sorted{ box-shadow: inset 0 -3px 0 0 var(--charcoal); }
  thead th:hover .sortcar.dim{ opacity:.4; }
  th.name, td.name{ position:sticky; left:0; z-index:2; text-align:left; box-shadow:1px 0 0 var(--grid); }
  thead th.name{ z-index:4; }
  th.sel, td.sel{ position:sticky; left:0; z-index:2; padding:0; }
  thead th.sel{ z-index:4; }
  .hasSel th.name, .hasSel td.name{ left:34px; }

  tr.chan > td{ background:var(--peach); }
  tr.chan > td.name{ background:var(--namebg); font-weight:600; }
  tr.chan > td.sel{ background:var(--namebg); }
  tr.chan{ cursor:pointer; }
  tr.chan:hover > td{ background:#fbe6cf; }
  tr.chan:hover > td.name, tr.chan:hover > td.sel{ background:#f6c191; }
  tr.chan.hidden > td{ background:#f3efea; color:#8c847b; }
  tr.chan.hidden > td.name, tr.chan.hidden > td.sel{ background:#e9e2d9; }
  tr.chan.picked > td.sel, tr.chan.picked > td.name{ background:#ffd9a8; }
  /* Creators the brand approved on a list (Tom, 16 Oct 2026): green and at the top, so the link shows the agreed plan. */
  tr.chan.chosen > td{ background:#eaf7ee; }
  tr.chan.chosen > td.name{ background:#d5f0dd; box-shadow:inset 4px 0 0 #1a7f37; }
  tr.chan.chosen:hover > td{ background:#dff3e5; }
  tr.show > td{ background:#fff; color:var(--child); }
  tr.show > td.name{ background:#fff; }
  tr.show.hidden > td{ color:#a39b92; background:#faf8f5; }
  tr.show .nmwrap{ padding-left:22px; }
  td.tcol{ background-clip:padding-box; }
  tr.chan > td.tcol{ background:#f4f8fc; }
  tr.chan.hidden > td.tcol{ background:#eef1f4; }

  .nmwrap{ display:flex; align-items:center; gap:7px; }
  .chev{ flex:0 0 auto; width:20px; height:20px; display:grid; place-items:center; color:#b45c00; border-radius:5px; transition:transform .18s, background .15s; }
  tr.chan:hover .chev:not(.spacer-ic){ background:rgba(180,92,0,.12); }
  .chev.spacer-ic{ visibility:hidden; }
  tr.chan.open .chev{ transform:rotate(90deg); }
  .av{ flex:0 0 auto; width:30px; height:30px; border-radius:50%; object-fit:cover; background:#fff; border:1px solid rgba(0,0,0,.08); }
  .avx{ flex:0 0 auto; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:#fff; color:#a85f00; font-size:13px; font-weight:700; border:1px solid #f0d3ac; }
  .nmtext{ overflow:hidden; white-space:normal; overflow-wrap:anywhere; line-height:1.3; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; padding:4px 0; }
  .nmtext a:hover{ text-decoration:underline; }
  .arrow{ color:var(--orange); margin-right:5px; }
  .exlink{ color:#c26a00; font-weight:600; }
  .exlink:hover{ text-decoration:underline; }
  td.wide{ text-align:left; }
  td.ideas{ text-align:left; white-space:normal; padding:10px 14px; }
  .idl{ margin:0; padding-left:16px; line-height:1.45; font-size:12.5px; }
  .idl li{ margin:2px 0; }
  .idnone{ color:var(--muted); font-size:12px; }
  .idact{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .ided{ border:1px solid #e4d8c7; background:#fff; color:#a85f00; font-size:11px; font-weight:700; border-radius:6px; padding:3px 9px; cursor:pointer; }
  .ided:hover{ background:#fff5ea; }
  .idown{ font-size:10.5px; font-weight:700; color:#2f7d4f; }
  #fbpop.wide{ width:420px; }
  #fbpop.wide textarea{ min-height:120px; }
  .cideas{ margin:10px 0 0; }
  .cideas .cl{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .ptag{ display:inline-block; font-size:10.5px; font-weight:800; color:#fff; background:#7a4cc2; border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:1px; }
  .selbar .presschk{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  td.wide.clickable{ cursor:pointer; }
  td.wide{ white-space:normal; padding-top:6px; padding-bottom:6px; }
  .clamp{ display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; line-height:1.4; overflow-wrap:anywhere; }
  td.wide.exp .clamp{ -webkit-line-clamp:unset; display:block; }
  /* Every channel row is as tall as three lines of About text, so a creator with a short
     description is not a squashed row (Tom, 10 Oct 2026). Expanded text still grows. */
  tr.chan > td.wide{ height:calc(4.2em + 13px); }
  .tag{ display:inline-block; font-size:10.5px; font-weight:800; color:#fff; background:#c26a00; border:1px solid #c26a00; border-radius:999px; padding:2px 9px; margin-left:8px; cursor:pointer; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  tr.chan:hover .tag{ background:#a85600; border-color:#a85600; }
  tr.chan.open .tag{ background:#fff; color:#a85f00; border-color:#e8b77a; box-shadow:none; }
  .pill{ display:inline-block; font-size:10.5px; font-weight:700; border-radius:999px; padding:2px 8px; }
  .pill.ok{ background:#e3f3e9; color:var(--ok); }
  .pill.no{ background:#f9e3df; color:var(--hide); }
  .pill.bundle{ background:#e8eefc; color:#2b4a9a; }
  .pill.prov{ background:#fff1d6; color:#8a5a00; margin-left:4px; }
  td.edit{ cursor:text; color:var(--team); font-weight:600; text-decoration:underline dotted #9db6cf; text-underline-offset:3px; }
  td.edit:hover{ background:#e1ecf7 !important; }
  td.edit input{ width:100%; font:inherit; text-align:center; border:1px solid var(--team); border-radius:5px; padding:3px; }
  td.edit.tcol{ color:var(--team); }
  td.saving{ opacity:.5; }
  .grip{ flex:0 0 auto; cursor:grab; user-select:none; color:#a87a4a; font-size:14px; line-height:1; }
  thead th{ position:sticky; }
  thead th.movable{ cursor:grab; padding-left:18px; }
  .hgrip{ position:absolute; left:5px; top:50%; transform:translateY(-50%); color:rgba(21,17,14,.45); font-size:13px; }
  thead th.movable:hover .hgrip{ color:var(--charcoal); }
  tr.chan:hover .grip{ color:#a85f00; }
  tr.chan.dragging > td{ opacity:.45; }
  tr.chan.drop-before > td{ box-shadow: inset 0 2px 0 0 var(--orange); }
  tr.chan.drop-after > td{ box-shadow: inset 0 -2px 0 0 var(--orange); }
  button.eye{ margin-left:auto; flex:0 0 auto; display:inline-flex; align-items:center; gap:1px; border:1px solid #e4d8c7; background:#fff; border-radius:6px; padding:2px 4px; cursor:pointer; }
  button.eye b{ font-size:10px; }
  button.eye:hover{ background:#fff5ea; }
  .why{ display:inline-block; max-width:110px; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; font-size:11px; color:var(--hide); margin-left:6px; }
  input.pick{ width:15px; height:15px; accent-color:var(--orange); cursor:pointer; }

  /* Tabs */
  .tabbar{ display:flex; align-items:stretch; gap:2px; background:#fff; border-top:1px solid #e9e0d3; padding:0 10px; min-height:40px; overflow-x:auto; }
  .tab{ border:0; background:transparent; font-size:12.5px; font-weight:600; color:var(--muted); padding:0 16px; cursor:pointer; display:flex; align-items:center; gap:7px; border-top:3px solid transparent; white-space:nowrap; }
  .tab .n{ font-size:10.5px; font-weight:700; opacity:.65; }
  .tab:hover{ color:var(--charcoal); background:#faf6f0; }
  .tab.active{ color:var(--charcoal); border-top-color:var(--orange); background:#fff5ea; }
  .tab .x{ margin-left:2px; font-size:13px; line-height:1; color:#b0a596; padding:2px 4px; border-radius:4px; }
  .tab .x:hover{ color:#fff; background:var(--hide); }
  .tab .x.confirm{ color:#fff; background:var(--hide); font-size:10.5px; font-weight:700; }

  /* Selection bar */
  .selbar{ display:none; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 16px; background:var(--charcoal); color:#fff; font-size:12.5px; }
  .selbar.on{ display:flex; }
  .selbar input{ font-family:var(--font); font-size:12.5px; border:0; border-radius:7px; padding:7px 10px; width:240px; max-width:100%; }
  .selbar .btn{ background:#fff; }
  .selbar .msg{ color:#ffcf99; font-weight:600; }
  .selbar .seltot{ display:flex; gap:14px; flex-wrap:wrap; flex-basis:100%; order:9; padding-top:6px; margin-top:2px; border-top:1px solid rgba(255,255,255,.15); }
  .selbar .seltot:empty{ display:none; }
  .selbar .seltot b{ color:#ffcf99; }
  .selbar .seltot .up{ color:#ffb3a6; } .selbar .seltot .dn{ color:#9fe0b4; } .selbar .seltot.busy{ opacity:.55; }

  /* Lists panel */
  .panel{ position:fixed; right:16px; top:60px; width:420px; max-width:calc(100vw - 32px); max-height:70vh; overflow:auto; background:#fff; border:1px solid #e4d8c7; border-radius:12px; box-shadow:0 18px 50px rgba(0,0,0,.18); z-index:20; display:none; }
  .panel.on{ display:block; }
  .panel h3{ margin:0; padding:14px 16px 8px; font-size:13px; }
  .panel .li{ padding:10px 16px; border-top:1px solid #f1e8dc; font-size:12px; }
  .panel .li .tt{ font-weight:700; font-size:12.5px; }
  .panel .li .mm{ color:var(--muted); font-size:11px; margin:2px 0 6px; }
  .panel .li .acts{ display:flex; gap:6px; flex-wrap:wrap; }
  .panel .empty{ padding:12px 16px 16px; color:var(--muted); font-size:12px; }
  .panel .lhead{ position:sticky; top:0; z-index:1; background:#fff; border-bottom:1px solid #f1e8dc; padding-bottom:12px; }
  .panel .lcount{ font-size:11px; font-weight:700; color:var(--muted); margin-left:4px; }
  .panel .lsearch{ display:block; margin:2px 16px 10px; }
  .panel .lsearch input{ width:100%; }
  .lchips{ display:flex; flex-wrap:wrap; gap:6px; padding:0 16px; }
  .lchip{ font-family:var(--font); font-size:11.5px; font-weight:600; border:1px solid #e4d8c7; background:#fff; color:#6b5c4d; border-radius:999px; padding:5px 11px; cursor:pointer; }
  .lchip:hover{ background:#fff5ea; }
  .lchip.on{ background:var(--team); border-color:var(--team); color:#fff; }

  .was{ display:block; font-size:10.5px; font-weight:600; color:#2f7d4f; line-height:1.2; margin-top:2px; }
  .was s{ color:var(--muted); font-weight:500; margin-right:4px; }
  .ckc{ display:inline-flex; align-items:center; justify-content:center; }
  .ckc input{ width:16px; height:16px; accent-color:var(--ok); cursor:pointer; }
  .ckc.disc input{ accent-color:var(--orange); }
  .stg{ display:inline-flex; flex-direction:column; gap:2px; font-size:11px; font-weight:600; line-height:1.2; text-align:left; }
  .stg label{ display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; }
  .stg input{ width:14px; height:14px; margin:0; cursor:pointer; accent-color:var(--orange); }
  .stg label:last-child input{ accent-color:var(--ok); }
  .stg label.bap input{ accent-color:#2a6fb0; }
  .stg label.bap .fbn{ padding:0 6px; font-size:10px; margin-left:2px; }
  .stg label.dft{ cursor:default; }
  .stg label.dft input{ cursor:default; pointer-events:none; }
  /* Stage tick boxes, one look for all three steps (Tom, 10 Oct 2026). */
  .stg{ gap:3px; width:138px; margin:7px 0; } /* four steps since 14 Oct: room above and below */
  .stg input[type=checkbox]{ appearance:none; -webkit-appearance:none; width:14px; height:14px; margin:0; border:1.5px solid #b9a996; border-radius:3px; background:#fff; display:inline-grid; place-content:center; flex:0 0 auto; }
  .stg input[type=checkbox]:checked{ background:var(--orange); border-color:var(--orange); }
  .stg label:last-child input[type=checkbox]:checked{ background:var(--ok); border-color:var(--ok); }
  .stg input[type=checkbox]:checked::after{ content:"✓"; color:#fff; font-size:10px; font-weight:800; line-height:1; }
  .drow{ display:flex; align-items:center; gap:4px; }
  .tri{ display:flex; align-items:center; gap:5px; background:none; border:0; padding:0; font:inherit; font-size:11px; font-weight:600; color:inherit; cursor:pointer; white-space:nowrap; }
  .tri .bx{ width:14px; height:14px; box-sizing:border-box; border:1.5px solid #b9a996; border-radius:3px; background:#fff; display:inline-grid; place-content:center; flex:0 0 auto; }
  .tri.yes .bx{ background:var(--ok); border-color:var(--ok); }
  .tri.yes .bx::after{ content:"✓"; color:#fff; font-size:10px; font-weight:800; line-height:1; }
  .tri.no .bx{ background:#b23a2a; border-color:#b23a2a; }
  .tri.no .bx::after{ content:"✕"; color:#fff; font-size:9px; font-weight:800; line-height:1; }
  .tri.yes .lb{ color:var(--ok); } .tri.no .lb{ color:#b23a2a; }
  .tri.cr.ro{ cursor:default; }
  .nt{ display:inline-flex; align-items:center; background:none; border:0; padding:1px; cursor:pointer; color:#b9a996; }
  .nt:hover{ color:#a85f00; } .nt.has{ color:var(--orange); }
  /* Brands (Tom, 15 Oct 2026): our Stage boxes read as read-only, the brand's own box reads as the one to click */
  .stg label.dft, .tri.cr.ro{ color:#aaa196; }
  .stg label.dft input[type=checkbox]:not(:checked), .tri.cr.ro:not(.yes):not(.no) .bx{ border-color:#ddd5cb; background:#f6f3ef; }
  .drow.ask .tri:not(.yes):not(.no) .bx{ border-color:var(--orange); box-shadow:0 0 0 2px rgba(240,130,0,.14); }
  .drow.ask .tri:not(.yes):not(.no) .lb{ color:#a85f00; }
  .drow.ask .tri:hover .bx{ box-shadow:0 0 0 3px rgba(240,130,0,.3); }
  .drow.ask .tri:hover .lb{ text-decoration:underline; text-underline-offset:2px; }
  .dec{ display:flex; align-items:center; gap:4px; margin:1px 0 1px 1px; }

const lockedMsg=()=>editingList
  ?"You're choosing creators for “"+editingList.title+"”. To change its videos or prices, use “Change "+editingList.title+"'s numbers” above."
  :"This is the main rate card. Go back to the list to change its numbers, or open the main page to change the rate card.";

const $=s=>document.querySelector(s);
const money=v=>v==null?"":"$"+Math.round(v).toLocaleString();
const money2=v=>v==null?"":"$"+(Math.round(v*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const int=v=>v==null?"":Math.round(v).toLocaleString();
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const numv=v=>{const n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;};
function toast(msg,err){const t=$("#toast");t.textContent=msg;t.className="toast on"+(err?" err":"");clearTimeout(toast._t);toast._t=setTimeout(()=>t.className="toast",err?5000:2600);}

const kindOf=()=>(GROUPS.find(g=>g.id===activeTab)||{}).kind||"long";
const dispName=n=>RENAME[n]||n;
function dispHandle(c){
  const h=String(c.handle||"").trim();
  if(!h) return dispName(c.name);
  const at=(h.charAt(0)==="@"?h:"@"+h).toLowerCase(); // handles always lowercase (Tom, 8 Oct 2026)
  return (/[-–]\s*shorts\s*$/i.test(c.name)&&activeTab!==SHORTS_GROUP)?at+" · Shorts":at;
}

// Column set for the current tab and mode.
function brandColsFor(){
  const k=kindOf();
  const team=mode==="team";
  // Short form (Shorts / Instagram / TikTok / Snapchat), Tom 13 Oct 2026: priced by the post,
  // not by views. Production fee (tier by channel size) + a Publishing Rate of 20% of it, and
  // the usage-rights note. Avg Views is shown for context only. No CPM on these tabs.
  const showShortCpm=team||listEdit();
  let cols=BRAND_COLS.filter(c=>{
    // Saved lists: the team's Stage column, which brands see as "Your feedback".
    if(c.listOnly) return !!(BRAND&&BRAND.list&&mode!=="team");
    if(c.pressOnly) return isPress()||(paidIdeas()&&activeTab!=="dedicated");
    if(isPress()&&PRESS_HIDE.has(c.key)) return false;
    if(c.listEditOnly) return listEdit();
    if(c.shortOnly) return k!=="long";
    if(c.key==="vg") return true;
    if(c.key==="cpm"&&k!=="long") return false;
    // Dedicated videos (Tom, 14 Oct 2026): no CPM for brands; the team still sees it, marked DFT only.
    if(c.key==="cpm"&&activeTab==="dedicated"&&!team&&!listEdit()) return false;
    return !(c.longOnly&&k!=="long");
  });
  // Shorts / Instagram / TikTok for brands: no demographics, audience, ad types,
  // exclusivity, host or host gender columns (Tom, 6 Oct 2026). The DFT view keeps them.
  if(k!=="long"&&!team) cols=cols.filter(c=>!SHORT_HIDE.has(c.key));
  if(k!=="long") cols=cols.map(c=>{
    if(c.key==="vg") return Object.assign({},c,{head:"Avg Views",tip:"Average views per post last quarter. For context only: not a guarantee and not part of the price."});
    if(c.key==="rate") return Object.assign({},c,{head:"Publishing Rate",w:132,tip:"20% of the Production Rate, for the creator to post it on their own channel. Total Rate = Production Rate + Publishing Rate."});
    if(c.key==="cpm") return Object.assign({},c,{t:1,tip:"DFT only, brands never see the CPM on this tab."});
    return c;
  });
  if(isPress()){
    // Press packages lead with the ideas: Stage, Campaign ideas, audience, then the rest.
    let pc=finishCols(cols.map(c=>c.key==="vg"?Object.assign({},c,{head:"Typical views",w:120,tip:"Average views per video or post last quarter. For context only."}):c));
    const take=k=>{ const i=pc.findIndex(c=>c.key===k); return i<0?[]:pc.splice(i,1); };
    const lead=[...take("confirmed"),...take("ideas"),...take("subs"),...take("vg")];
    return lead.concat(pc);
  }
  if(k==="long"&&estLong()) cols=cols.map(c=>c.key==="vg"?Object.assign({},c,{head:"Estimated Views",tip:"Estimated views across the videos, based on each channel's recent averages. An estimate, not a guarantee."}):c);
  // Dedicated videos (Tom, 13 Oct 2026) are a flat price with no view guarantee: always
  // shown as Estimated Views, on the main rate card and on every saved list.
  if(k==="long"&&activeTab==="dedicated") cols=cols.map(c=>c.key==="vg"?Object.assign({},c,{head:"Estimated Views",tip:"Estimated views for a whole video about the brand, based on the channel's recent averages. An estimate, not a guarantee: a dedicated video is a flat price (3x the YouTube integration rate)."}):c);
  if(team&&!baseLocked()) cols=cols.map(c=>{
    if(c.key==="vg") return Object.assign({},c,{w:146,edit:"vg",head:k==="long"?(activeTab==="dedicated"?"Estimated Views":"View Guarantee ✎"):"Avg Views ✎",tip:k==="long"?"Click to edit what brands see. Holds until the quarter resets.":"Shown to brands for context only. It sets the production fee tier ($3,000, $5,000 from 100k, $7,500 from 250k); the Publishing Rate is 20% of that fee. Click to edit."});
    if(c.key==="cpm") return Object.assign({},c,{edit:"cpm",head:"CPM ✎",w:84,tip:k==="long"?"Click to edit what brands see. Holds until the quarter resets.":"Not shown to brands. Sets the rate. Click to edit."});
    // Number of videos brands are quoted (Tom, 9 Oct 2026). Clear it to go back to the
    // automatic bundle. Fewer videos than the minimum needs are still priced at $1,500.
    if(c.key==="minVideos"&&k==="long") return Object.assign({},c,{edit:"videos",head:"Videos ✎",w:112,tip:"Number of videos brands are quoted. View Guarantee = views per video x videos, Rate = that x CPM, minimum $1,500. Holds until the quarter resets. Clear the box to go back to the automatic count."});
    if(c.key==="rate") return Object.assign({},c,{tip:k==="long"?"Worked out from View Guarantee x CPM, minimum $1,500. Small YouTube rows are sold as a bundle of up to 10 videos instead of being lifted to $1,500.":"20% of the production fee ($3,000, $5,000 from 100k avg views, $7,500 from 250k). Total Rate = fee + this."});
    return c;
  });
  // Signed in on a saved list's page (brand preview): the numbers are editable for THIS
  // list only. YouTube: view guarantee (per video) and CPM. Other tabs: the rate.
  // Every tab: View Guarantee / Estimate and CPM; short form also the production fee.
  if(listEdit()) cols=cols.map(c=>{
    const tip="Price for this list only. The roster and other lists are not changed. Clear the box to go back to the roster price.";
    if(c.key==="vg") return Object.assign({},c,{w:146,edit:"vg",head:k==="long"?(estLong()||activeTab==="dedicated"?"Estimated Views ✎":"View Guarantee ✎"):"Avg Views ✎",tip});
    if(c.key==="cpm") return Object.assign({},c,{edit:"cpm",head:k==="long"?"CPM ✎":"CPM ✎ (DFT only)",w:k==="long"?84:130,tip:k==="long"?tip:"Brands do not see this column. "+tip});
    if(c.key==="fee") return Object.assign({},c,{edit:"fee",head:"Production Rate ✎",w:160,tip});
    // Discount by rate on every tab (Tom, 15 Oct 2026): type the price itself, not only the CPM.
    // YouTube: the Rate (kept as the CPM that gives it). Short form: the Total Rate (kept as the
    // production fee that gives it).
    if(c.key==="rate"&&k==="long") return Object.assign({},c,{edit:"rate",head:"Rate ✎",w:Math.max(c.w||0,112),tip});
    if(c.key==="total"&&k!=="long") return Object.assign({},c,{edit:"total",head:"Total Rate ✎",w:Math.max(c.w||0,124),tip});
    // Number of videos (Tom, 9 Oct 2026): the view guarantee and rate follow it. Fewer
    // videos than the $1,500 minimum needs are still priced at $1,500.
    if(c.key==="minVideos"&&k==="long") return Object.assign({},c,{edit:"videos",head:"Videos ✎",w:112,tip:"Number of videos for this list only. View Guarantee = views per video x videos, Rate = that x CPM, minimum $1,500. Clear the box to go back to the automatic count."});
    return c;
  });
  if(activeTab==="dedicated") cols=cols.map(c=>c.key==="cpm"?Object.assign({},c,{t:1,head:c.edit?"CPM ✎ (DFT only)":"CPM (DFT only)",w:c.edit?130:112,tip:"Brands never see the CPM on dedicated videos. "+(c.tip||"")}):c);
  if(paidIdeas()){ // ideas lead, right after the Stage, with the creator's numbers after them
    const pc=finishCols(cols.map(c=>c.key==="ideas"?Object.assign({},c,{w:360,tip:"Ideas for how this creator would feature the campaign in their own content."}):c));
    const i=pc.findIndex(c=>c.key==="ideas"); if(i<0) return pc;
    const [idc]=pc.splice(i,1); const at=pc.findIndex(c=>c.key==="confirmed"); pc.splice(at<0?0:at+1,0,idc); return pc;
  }
  return finishCols(cols);
}
function finishCols(cols){
  if(colOrder&&colOrder.length){
    const pos={}; colOrder.forEach((key,i)=>pos[key==="videos"?"adLength":key]=i);
    // A column added after an order was saved slots in beside its neighbour, not at the end.
    // The short-form price columns follow Rate: Rate, Content Production, Total Rate, Usage Rights.
    BRAND_COLS.forEach((c,i)=>{ if(pos[c.key]==null){ const a=AFTER[c.key]; if(a&&pos[a]!=null){ pos[c.key]=pos[a]+0.1; return; } const prev=BRAND_COLS.slice(0,i).reverse().find(p=>pos[p.key]!=null); pos[c.key]=prev?pos[prev.key]+0.5:-0.5; } });
    cols=cols.slice().sort((a,b)=>(pos[a.key]??999)-(pos[b.key]??999));
  }
  return cols.map(c=>c.key==="subs"&&FOLLOWER_TABS.has(activeTab)?Object.assign({},c,{head:"Followers"}):c);
}
// Column widths: drag a header's right edge (Tom, 8 Oct 2026). Kept per browser, and the
// team can save them for everyone with the layout.
// Stage never goes narrower than its buttons need (a width saved before Approve / Reject was
// added clipped the Note button, Tom 10 Oct 2026).
const MIN_W={confirmed:176};
function sized(cols){ return cols.map(c=>c.key!=="sel"&&colWidths[c.key]?Object.assign({},c,{w:Math.max(colWidths[c.key],MIN_W[c.key]||0)}):c); }
function columns(){
  const name={key:"name",head:"Creator / Shows",w:280,cls:"name"};
  if(mode!=="team") return sized([name].concat(brandColsFor()));
  // Signed in: the same columns in the same (movable) order brands see, with the blue
  // DFT-only block slotted in straight after the last of Rate / View Guarantee / CPM.
  // (These used to be pinned, which made dragging them look like it did nothing.)
  const bc=brandColsFor();
  const cut=Math.max(...["rate","vg","cpm","minVideos","fee","total"].map(k=>bc.findIndex(c=>c.key===k)));
  const tc=kindOf()==="long"?TEAM_COLS:TEAM_COLS.filter(c=>c.key!=="lcpm").map(c=>c.key==="lvg"?Object.assign({},c,{head:"Live Estimate",w:104}):c);
  return sized([{key:"sel",head:"",w:34,cls:"sel"},Object.assign({},name,{w:320})].concat(bc.slice(0,cut+1),tc,bc.slice(cut+1)));
}

function cellVal(c,col){
  switch(col.key){
    case "lavg": return c.live?c.live.avg:null;
    case "lvg": return c.live?c.live.vg:null;
    case "lrate": return c.live?c.live.rate:null;
    case "lcpm": return c.live?c.live.cpm:null;
    case "basis": return c.brand?((c.brand.quarter?c.brand.quarter+": ":"")+(c.brand.note||"")):"";
    default: return c[col.key];
  }
}
// The middle Stage step (Tom, 10 Oct 2026): one tick box that cycles approved (green tick),
// rejected (red cross), clear, plus a small note icon. Same box as Approached and Confirmed.
const NOTE_ICON='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
function decisionRow(c,team){
  const ok=!!(c.fb&&c.fb.ok), no=!!(c.fb&&c.fb.no), note=(c.fb&&c.fb.note)||"";
  const state=ok?"yes":no?"no":"", label=ok?"Brand approved":no?"Brand rejected":(team?"Brand approval":"Approve?");
  const tip=team?"The brand's decision. Click to set it for them: approved, rejected, clear.":"Click once to approve, twice to reject, again to clear.";
  const noteBtn=(team&&!note)?"":`<button class="nt${note?" has":""}${team?" ro":""}" data-id="${c.id}" title="${note?esc(note):"Add a note: tell us why, or anything else"}">${NOTE_ICON}</button>`;
  return `<span class="drow${team?"":" ask"}"><button class="tri ${state}" data-id="${c.id}" data-s="${state}" title="${tip}"><span class="bx"></span><span class="lb">${label}</span></button>${noteBtn}</span>`;
}
// The creator's response (Margot, 14 Oct 2026): DFT sets interested or declined and can add
// a note the brand reads (why they declined, or the idea they already have). Brands read only.
function creatorRow(c,team){
  const ok=!!(c.cr&&c.cr.ok), no=!!(c.cr&&c.cr.no), note=(c.cr&&c.cr.note)||"";
  const state=ok?"yes":no?"no":"", label=ok?"Creator interested":no?"Creator declined":"Creator response";
  const tip=team?"The creator's answer. Click: interested, declined, clear. The speech bubble adds a note the brand will see.":(ok?"This creator would like to work with you":no?"This creator has declined":"Waiting on the creator's answer");
  const noteBtn=(!team&&!note)?"":`<button class="nt crn${note?" has":""}" data-id="${c.id}" title="${note?esc(note):"Add a note for the brand: what the creator said"}">${NOTE_ICON}</button>`;
  return `<span class="drow cr"><button class="tri cr ${state}${team?"":" ro"}" data-id="${c.id}" data-s="${state}" title="${tip}"${team?"":' tabindex="-1"'}><span class="bx"></span><span class="lb">${label}</span></button>${noteBtn}</span>`;
}
function fmtCell(c,col,isShow){
  if(col.key==="ideas"&&!isShow){
    const lines=String(c.ideas||"").split("\n").map(x=>x.trim()).filter(Boolean);
    const canEdit=(listEdit()&&(isPress()||paidIdeas()))||(mode==="team"&&!baseLocked()&&!isDed(c));
    const body=lines.length?`<ul class="idl">${lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:(canEdit?`<span class="idnone">No ideas yet</span>`:"");
    return body+(canEdit?`<div class="idact">${listEdit()&&c.ideaOwn?'<span class="idown">This list only</span>':""}<button class="ided" data-id="${c.id}" onclick="event.stopPropagation()">Edit</button></div>`:"");
  }
  if(col.key==="status") return statusCell(c,isShow);
  if(col.key==="confirmed"){
    if(isShow) return "";
    if(listEdit()){ const st=c.stage||(c.confirmed?"confirmed":"");
      // Stage (Tom, 10 Oct 2026), three steps: Approached, the brand's decision (approve or
      // reject, with a note), Confirmed. The team can set the decision for a brand that told
      // us another way.
      return `<span class="stg" onclick="event.stopPropagation()">${decisionRow(c,true)}<label title="We have reached out to this creator"><input type="checkbox" class="conf" data-id="${c.id}" data-st="approached" ${st?"checked":""}>Approached</label>${creatorRow(c,true)}<label title="Locked in for this campaign"><input type="checkbox" class="conf" data-id="${c.id}" data-st="confirmed" ${st==="confirmed"?"checked":""}>Confirmed</label></span>`; }
    // Brand approval comes first, top left, for the team and for brands (Tom, 15 Oct 2026: a brand clicked
    // the first box, Approached, which is ours, and thought the list could not be used).
    // Brands (Tom, 10 Oct 2026): the same three steps. Approached and Confirmed are DFT's, shown
    // but not clickable; the middle step is theirs: Approve or Reject, and a note.
    const st=c.stage||(c.confirmed?"confirmed":"");
    return `<span class="stg" onclick="event.stopPropagation()">${decisionRow(c,false)}<label class="dft" title="Digital Fox Talent has reached out to this creator"><input type="checkbox" tabindex="-1" onclick="return false" ${st?"checked":""}>Approached</label>${creatorRow(c,false)}<label class="dft" title="Locked in by Digital Fox Talent"><input type="checkbox" tabindex="-1" onclick="return false" ${st==="confirmed"?"checked":""}>Confirmed</label></span>`;
  }
  if(col.key==="disc") return `<label class="ckc disc" onclick="event.stopPropagation()"><input type="checkbox" class="dsc" data-id="${c.id}"${isShow?' data-show="1"':""} ${c.disc?"checked":""} title="Discount: tick, then lower the rate or CPM"></label>`;
  if(c.wasRate&&((col.key==="rate"&&(c.kind==="long"||isShow))||(col.key==="total"&&c.kind!=="long"&&!isShow))){
    const was=col.key==="rate"?c.wasRate:c.wasTotal;
    return `${money(cellVal(c,col))}<span class="was"><s>${money(was)}</s>${c.discPct}% off</span>`;
  }
  const v=cellVal(c,col);
  if(col.fmt==="money") return money(v);
  if(col.fmt==="money2") return money2(v);
  if(col.fmt==="int") return int(v);
  if(col.key==="minVideos") return v==null?"":(v>1?`<span class="pill bundle" title="${esc(v+" videos. "+(estLong()||isDed(c)?"Estimated views":"View guarantee")+" and rate cover all "+v+(c.vgPer?" (about "+int(c.vgPer)+" views each)":""))}">${v} videos</span>`:"1");
  if(col.key==="simulcast") return v?`<span class="pill ok" title="Also on Spotify Video and podcast apps, included at this rate">${esc(v)}</span>`:"";
  if(col.key==="kit") return v?`<a class="exlink" href="${esc(v)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Audience ↗</a>`:"";
  if(col.key==="adEx") return v?`<a class="exlink" href="${esc(v)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Examples ↗</a>`:"";
  return esc(v);
}
function statusCell(c,isShow){
  const pill=c.show?`<span class="pill ok">Shown</span>`:`<span class="pill no" title="${esc(c.why)}">Hidden</span>`;
  const prov=c.brand&&c.brand.provisional?`<span class="pill prov" title="Not frozen yet: priced from today's average until tomorrow's snapshot">Provisional</span>`:"";
  const why=c.why?`<span class="why" title="${esc(c.why)}">${esc(c.why)}</span>`:"";
  return `${pill}${prov}${why}`;
}
function logoHtml(c){

// Show-to-brands switch beside the name (DFT view only): Auto -> Always show -> Hide -> List only.
const EYE={"Auto":["Auto: brands see this unless it breaks the CPM cap","#8a7d70"],"Always show":["Always shown to brands","#2f7d4f"],"Hide":["Hidden from brands","#b23a2a"],"List only":["List only: can go on a saved list, never shown on the main rate card","#2a6fb0"]};

function rowsFor(list,cols){
  let html="";
  list.forEach(c=>{
    const open=openSet.has(c.id);
    const cls=["chan",open?"open":"",mode==="team"&&!c.show?"hidden":"",picked.has(c.id)?"picked":"",BRAND&&BRAND.list&&c.fb&&c.fb.ok?"chosen":""].join(" ");
    html+=`<tr class="${cls}" data-id="${c.id}">`;
    cols.forEach(col=>{
      // Dedicated rows are priced from the YouTube tab, so on the main rate card they are read only.
      const ed=col.edit&&!(isDed(c)&&!listEdit());
      let inner, cl=(col.cls||"")+(col.t?" tcol":"")+(ed?" edit":"")+(ed&&listEdit()&&c.custom?" custom":"");
      if(col.key==="sel") inner=`<input type="checkbox" class="pick" data-id="${c.id}" ${picked.has(c.id)?"checked":""} onclick="event.stopPropagation()" title="Add to a list">`;
      else if(col.key==="name") inner=nameCell(c);

function cmp(a,b){
  if(!sortKey) return 0;
  const col=columns().find(c=>c.key===sortKey)||{};
  let r;
  if(sortKey==="name") r=dispHandle(a).localeCompare(dispHandle(b));
  else{
    const av=cellVal(a,col), bv=cellVal(b,col);
    const an=typeof av==="number"?av:numv(av), bn=typeof bv==="number"?bv:numv(bv);
    if(an!=null||bn!=null) r=(an==null?-Infinity:an)-(bn==null?-Infinity:bn);
    else r=String(av||"").localeCompare(String(bv||""));
  }
  return sortDir==="desc"?-r:r;
}
function orderedAll(){
  const all=((PAYLOAD&&PAYLOAD.groups[activeTab])||[]).slice();
  if(sortKey) return all.sort(cmp);
  const ord=rowOrder[activeTab];
  if(ord&&ord.length&&!(BRAND&&BRAND.list&&mode!=="team")){
    const pos={}; ord.forEach((id,i)=>pos[id]=i);
    const base={}; all.forEach((c,i)=>base[c.id]=i);
    all.sort((a,b)=>((pos[a.id]??1e6+base[a.id])-(pos[b.id]??1e6+base[b.id])));
  }
  // On a list, creators the brand approved come first (Tom, 16 Oct 2026); the order is otherwise kept.
  if(BRAND&&BRAND.list){ const won=c=>c.fb&&c.fb.ok?0:1, at={}; all.forEach((c,i)=>at[c.id]=i); all.sort((a,b)=>(won(a)-won(b))||(at[a.id]-at[b.id])); }
  return all;
}

// Excel-style column resize: drag a header's right edge; double-click it to reset.
function wireResize(sc){
  const table=sc.querySelector("table"); if(!table) return;
  const colEls=[...table.querySelectorAll("colgroup col")];
  const ths=[...table.querySelectorAll("thead th")];
  sc.querySelectorAll(".rsz").forEach(h=>{
    h.addEventListener("click",e=>e.stopPropagation());
    h.addEventListener("dblclick",e=>{ e.stopPropagation(); delete colWidths[h.dataset.k]; layoutChanged(); render(); });
    h.addEventListener("mousedown",e=>{
      e.preventDefault(); e.stopPropagation();
      const th=h.closest("th"), i=ths.indexOf(th), col=colEls[i]; if(!col) return;
      th.removeAttribute("draggable");
      const startX=e.clientX, startW=th.getBoundingClientRect().width, startT=table.getBoundingClientRect().width;
      let w=startW; h.classList.add("on"); document.body.classList.add("resizing");
      const move=ev=>{ w=Math.max(48,Math.min(1600,Math.round(startW+ev.clientX-startX))); col.style.width=w+"px"; table.style.width=(startT+w-startW)+"px"; };
      const up=()=>{
        document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up);
        h.classList.remove("on"); document.body.classList.remove("resizing"); 
        wireResize.at=Date.now();
        if(Math.abs(w-startW)>=2){ colWidths[h.dataset.k]=w; layoutChanged(); }
      };
      document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
    });
  });
}

function startListEdit(td){
  const f=findListRow(td.dataset.id); if(!f) return;
  const field=td.dataset.edit, r=f.row, isVid=field==="videos";
  const cur=isVid?(r.minVideos||1):field==="vg"?(r.vgPer!=null?r.vgPer:r.vg):(field==="cpm"&&r.videosSet&&r.askCpm?r.askCpm:r[field]);
  const hint=isVid?"Number of videos, for this list only. Clear it to go back to the automatic count."
    :`${field==="vg"?(f.kind==="long"?"Views per video":"Estimated views per post")+", for this list only":"For this list only"}. Clear it to go back to the roster price.`;
  td.innerHTML=`<input type="number" min="${isVid?1:0}"${isVid?' max="50"':""} step="${field==="cpm"?"0.01":"1"}" value="${cur==null?"":cur}" title="${hint}">`;
  const inp=td.querySelector("input"); inp.focus(); inp.select();
  let done=false;
  const finish=async commit=>{ if(done) return; done=true; inp.dataset.done="1";
    const raw=inp.value.trim(), v=numv(raw);
    if(!commit||(raw!==""&&(v==null||v===cur))||(raw===""&&!(isVid?r.videosSet:r.custom))){ render(); return; }
    if(isVid&&raw!==""&&!(v>=1&&v<=50&&Math.round(v)===v)){ toast("Videos must be a whole number from 1 to 50",true); render(); return; }
    td.classList.add("saving");
    const body={op:"list-price",slug:LIST_SLUG,id:td.dataset.id};
    if(raw===""){ body.clear=true; if(isVid) body.field="videos"; }
    else if(isVid) body.videos=v;
    else { body[field]=v; body.curVg=r.vgPer!=null?r.vgPer:r.vg; body.curCpm=r.askCpm||r.cpm; body.curVideos=r.minVideos||1; if(f.kind!=="long") body.curFee=r.fee!=null?r.fee:(r.vg>=250000?7500:r.vg>=100000?5000:3000); }
    // The typed number shows at once; the totals follow when the save comes back.
    td.textContent=raw===""?"…":field==="cpm"?money2(v):(field==="rate"||field==="total"||field==="fee")?money(v):int(v);
    const note=raw===""||isVid?"":listMinNote(f,r,field,v);
    // YouTube rows: the new rate and any discount show straight away too (Tom, 12 Oct 2026),
    // worked out the same way the server does: views x CPM, crossed out against the CPM the
    // discount started from. The save's answer then confirms it.
    if(f.kind==="long"&&raw!==""&&!isVid&&!note&&(field==="cpm"||field==="vg")&&r.vg>0){
      const n=r.minVideos||1, per=field==="vg"?v:(r.vgPer!=null?r.vgPer:r.vg/n), cpm=field==="cpm"?v:(r.askCpm||r.cpm);
      // On a list there is no $1,500 minimum once the list sets its own CPM (Tom, 12 Oct 2026).
      const rate=Math.round(per*n*cpm/1000);
      const from=r.disc?(r.wasRate?r.wasRate*1000/r.vg:(r.askCpm||r.cpm)):null;
      const was=from?Math.round(per*n*from/1000):0;
      patchListRow(td.dataset.id,x=>{ x.vg=per*n; x.vgPer=per; x.cpm=cpm; if(x.askCpm!=null) x.askCpm=cpm; x.rate=rate; x.total=rate; x.custom=true;
        if(was>rate){ x.wasRate=was; x.wasTotal=was; x.discPct=Math.round((1-rate/was)*100); } else { delete x.wasRate; delete x.wasTotal; delete x.discPct; } });
    }
    listSave(body,body.clear?(isVid?"Back to the automatic number of videos":"Back to the roster price for this list"):note?"Saved for this list only. "+note:(isVid?"Videos saved for this list only":"Saved for this list only")).catch(()=>{});
  };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") finish(true); if(e.key==="Escape") finish(false); });
  inp.addEventListener("blur",()=>finish(true));
  inp.addEventListener("click",e=>e.stopPropagation());
}
// Main rate card safeguards (Tom, 9 Oct 2026): every change to the main rate card is
// confirmed in a small bar first and can be undone straight after. The API also refuses an
// edit that does not say it is for the main rate card, so pages opened before this rule
// cannot change it.
let cbarDone=null;
function confirmBar(html,yes,onYes,onNo){
  // Close any bar still showing first (Tom, 12 Oct 2026): closing it after opening the new one
  // hid the new bar too, so a second edit made within 10 seconds of the last was never saved.
  if(cbarDone) cbarDone(false);
  const bar=$("#cbar"); $("#cbarText").innerHTML=html; $("#cbarYes").textContent=yes; $("#cbarNo").style.display=onNo===null?"none":"";
  bar.classList.add("on");
  const close=ok=>{ if(cbarDone!==close) return; cbarDone=null; bar.classList.remove("on"); document.removeEventListener("keydown",key,true); (ok?onYes:(onNo||(()=>{})))(); };
  const key=e=>{ if(e.key==="Escape"){ e.preventDefault(); close(false); } if(e.key==="Enter"&&!e.target.closest("input")){ e.preventDefault(); close(true); } };
  cbarDone=close; $("#cbarYes").onclick=()=>close(true); $("#cbarNo").onclick=()=>close(false);
  setTimeout(()=>document.addEventListener("keydown",key,true),0);
  return close;
}
const fmtNum=(field,v)=>v==null||v===""?"automatic":field==="cpm"?money2(v):field==="videos"?String(v):int(v);
const FIELD_NAME={videos:"videos",vg:"view guarantee",cpm:"CPM"};
// YouTube rows under the $1,500 minimum (Tom, 6 Oct 2026) are sold as a bundle at the same
// CPM, so a typed view guarantee can come back doubled. Say so before it is saved (Margot,
// 12 Oct 2026: the page "kept changing it to an amount I didn't want").
function minNote(f,field,v){
  if(f.kind!=="long"||field==="videos"||!f.row.brand) return "";
  const br=f.row.brand, vg=field==="vg"?v:(br.vgPer!=null?br.vgPer:br.vg), cpm=field==="cpm"?v:(br.askCpm||br.cpm||25);
  const per=vg*cpm/1000; if(!(per>0)||per>=1499.5) return "";
  if(f.row.videosSet) return per*f.row.videosSet>=1499.5?"":`Under the $1,500 minimum for ${f.row.videosSet} videos, so the rate is lifted to $1,500.`;
  const n=Math.ceil(1500/per-1e-9);
  if(n>10) return `Under the $1,500 minimum: it would take ${n} videos to get there, so brands will not see this row.`;
  return `Under the $1,500 minimum at ${money2(cpm)} CPM, so brands will see a ${n}-video bundle: ${int(vg*n)} views for ${money(per*n)}.`;
}
// On a saved list a lower CPM or a discount simply lowers the price (no $1,500 minimum), but a
// view guarantee typed below what $1,500 buys at $25 still becomes a bundle, sized at $25.
function listMinNote(f,r,field,v){
  if(f.kind!=="long"||field!=="vg"||r.videosSet) return "";
  const per=v*25/1000; if(!(per>0)||per>=1499.5) return "";
  const n=Math.ceil(1500/per-1e-9); if(n>10) return "";
  const cpm=r.askCpm||r.cpm||25;
  return `Under $1,500 at $25 CPM, so this is a ${n}-video bundle: ${int(v*n)} views for ${money(v*n*cpm/1000)}.`;
}

    const raw=inp.value.trim(), v=numv(raw);

// Saved-list changes (Tom, 11 Oct 2026): the page changes straight away and the save runs
// behind it. Saves for a list go one at a time, in the order they were made, so quick
// clicks can never overtake each other. If a save fails, the list is put back to what
// monday holds and the reason is shown.
let listQ=Promise.resolve(), listPending=0;
function listSave(body,okMsg){
  listPending++; document.body.classList.add("saving-list");
  const run=listQ.then(async()=>{
    try{ const j=await post(body); listPending--; if(!listPending) applyBrand(j); if(okMsg) toast(okMsg); syncTeamList(j); return j; }
    catch(e){ listPending--; toast("Not saved, so it has been put back: "+e.message,true); try{ await loadBrand(true); }catch(_){ render(); } throw e; }
    finally{ if(!listPending) document.body.classList.remove("saving-list"); }
  });
  listQ=run.catch(()=>{});
  return run;
}

// with the creators ticked right now, at the prices brands would see, and how that compares
// with the saved list. Worked out by the server so list prices and discounts are included.
let totTimer=null, totSeq=0, totKey="";
function queueTotals(){
  const ids=[]; GROUPS.forEach(g=>((TEAM&&TEAM.groups[g.id])||[]).forEach(c=>{ if(picked.has(c.id)) ids.push(c.id); }));
  const key=(editingList?editingList.slug:"")+"|"+ids.join(",");
  if(key===totKey) return; totKey=key;
  $("#selTotals").classList.add("busy");
  clearTimeout(totTimer);
  totTimer=setTimeout(async()=>{
    const seq=++totSeq;
    try{
      const j=await post({op:"list-preview",slug:editingList?editingList.slug:null,ids});
      if(seq!==totSeq) return;
      const n=j.now, sv=j.saved, d=sv?n.total-sv.total:0;
      const el=editingList&&((TEAM&&TEAM.lists)||[]).find(x=>x.slug===editingList.slug);
      if((el&&el.press)||(!editingList&&$("#pressNew").checked)){ $("#selTotals").innerHTML=`<span>Press package: no prices</span><span><b>${n.profiles}</b> creators</span>`; return; }
      const views=[n.ytViews?`<span><b>${int(n.ytViews)}</b> ${j.estViews?"estimated":"guaranteed"} YouTube views</span>`:"",n.dedViews?`<span><b>${int(n.dedViews)}</b> estimated dedicated video views</span>`:"",n.shortViews?`<span><b>${int(n.shortViews)}</b> average short-form views</span>`:""].join("");
      $("#selTotals").innerHTML=`<span>Package total <b>${money(n.total)}</b></span>`
        +(sv&&d?`<span class="${d>0?"up":"dn"}" title="Compared with the saved list (${money(sv.total)})">${d>0?"+":"−"}${money(Math.abs(d))} vs saved</span>`:sv?`<span title="Same as the saved list">same as saved</span>`:"")
        +(n.discount>0?`<span>Discount <b>${money(n.discount)}</b></span>`:"")
        +`<span><b>${n.videos}</b> video${n.videos===1?"":"s"}</span>${views}`
        +(j.missing>0?`<span title="Set to Hide, or no figures yet, so brands would not see them on the list">${j.missing} not shown to brands</span>`:"");
    }catch(e){ if(seq===totSeq) $("#selTotals").textContent=""; }
    finally{ if(seq===totSeq) $("#selTotals").classList.remove("busy"); }
  },350);
}

  try{
    for(let i=0;i<ids.length;i+=25){ btn.textContent=`Drafting ${Math.min(i+25,ids.length)} of ${ids.length}…`; const j=await post({op:"ideas-draft",ids:ids.slice(i,i+25)}); made+=j.done||0; }
    toast(`Drafted ideas for ${made} creator${made===1?"":"s"}. Check them, then edit any that need it`);
  }catch(e){ toast(e.message,true); }
  await loadBrand(true);
}
// Accept changes (Tom, 13 Oct 2026): once the brand has answered, take every creator they did
// not approve (a cross, or no answer) off the list in one go. Approved creators stay. Two
// clicks, so it never happens by accident, and it never empties a list.
function acceptButton(){
  // Only once the brand has approved someone: before that there is nothing to accept.
  const any=GROUPS.some(g=>((BRAND&&BRAND.groups[g.id])||[]).some(c=>c.fb&&c.fb.ok));
  if(!any) return "";
  return `<button class="btn" id="acceptBtn" title="Take every creator the brand has not approved (a cross or no answer) off this list. Approved creators stay.">Accept changes</button>`;
}
function notApprovedIds(){
  const out=[]; GROUPS.forEach(g=>((BRAND&&BRAND.groups[g.id])||[]).forEach(c=>{ if(!(c.fb&&c.fb.ok)) out.push(String(c.id)); }));
  return out;
}
async function acceptChanges(btn){
  const drop=notApprovedIds(), total=GROUPS.reduce((n,g)=>n+((BRAND&&BRAND.groups[g.id])||[]).length,0);
  if(!drop.length){ toast("Every creator on this list is approved, so there is nothing to remove"); return; }
  if(drop.length>=total){ toast("Nobody on this list is approved yet, so nothing was removed",true); return; }
  if(!btn.classList.contains("confirm")){
    btn.classList.add("confirm"); btn.style.color="var(--hide)";
    btn.textContent=`Remove ${drop.length} not approved? Click again`;
    setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove("confirm"); btn.style.color=""; btn.textContent="Accept changes"; } },5000);
    return;
  }
  try{
    await listSave({op:"list-remove",slug:LIST_SLUG,ids:drop},`${drop.length} not approved ${drop.length===1?"creator":"creators"} taken off this list`);
    const l=((TEAM&&TEAM.lists)||[]).find(x=>x.slug===LIST_SLUG);
    if(l){ const d=new Set(drop); l.ids=l.ids.map(String).filter(id=>!d.has(id)); }
  }catch(e){}
}
const fmtDate=d=>{ const t=new Date(String(d)+"T12:00:00Z"); return isNaN(t)?String(d||""):t.toLocaleDateString("en-US",{day:"numeric",month:"short",year:"numeric"}); };
async function toggleLock(on){
  try{ const j=await post({op:"list-lock",slug:LIST_SLUG,lock:on}); applyBrand(j); toast(on?"Prices locked for this campaign":"Unlocked: this list follows the quarterly prices again"); loadTeam(true).catch(()=>{}); }
  catch(e){ toast(e.message,true); }
}
function renderBanner(){
  const b=$("#banner");
  if(TEAM&&mode==="team"&&LIST_SLUG&&BRAND&&BRAND.list){
    b.className="banner warn"; b.style.display="";
    b.innerHTML=`This is the <b>main rate card</b>, not “${esc(BRAND.list.title)}”. Its numbers are locked here. <button class="bbtn" id="backToList">Back to “${esc(BRAND.list.title)}”</button> <a class="bbtn" href="/">Change the main rate card</a><span class="spacer"></span><a href="/auth/signout" style="text-decoration:underline">Sign out</a>`;
    $("#backToList").onclick=()=>setMode("edit");
  } else if(TEAM&&mode==="team"&&editingList){
    b.className="banner warn"; b.style.display="";
    b.innerHTML=`<span>Choosing creators for <b>“${esc(editingList.title)}”</b>: tick or untick, then press <b>Update list</b>. Prices are locked while you do this.</span> <a class="bbtn" href="/r/${esc(editingList.slug)}">Change “${esc(editingList.title)}”'s numbers</a> <button class="bbtn" id="doneList">Done</button><span class="spacer"></span><a href="/auth/signout" style="text-decoration:underline">Sign out</a>`;
    $("#doneList").onclick=()=>{ picked.clear(); editingList=null; $("#listName").value=""; $("#selMsg").textContent=""; renderBanner(); render(); };
  } else if(TEAM&&asBrand&&BRAND&&BRAND.list&&mode!=="team"){
    b.className="banner list brandbar"; b.style.display="";
    b.innerHTML=brandBar();
    const sp=$("#sendPicks"); if(sp) sp.onclick=()=>toast("Preview only: the brand presses this when they have finished, and we get the feedback email straight away.");
  } else if(TEAM){
    if(listEdit()){
      b.className="banner listbar"; b.style.display="";
      const pr=isPress(), pi=paidIdeas(), missing=(pr||pi)?GROUPS.reduce((n,g)=>n+(g.id==="dedicated"?0:(BRAND.groups[g.id]||[]).filter(c=>!String(c.ideas||"").trim()).length),0):0;
      b.innerHTML=`<div class="lb-acts"><a class="btn" href="/?edit=${encodeURIComponent(LIST_SLUG)}">Add / remove creators</a>${typeButton()}${pr?"":ideasButton()+lockButton()+viewsButton()}${missing?`<button class="btn" id="draftIdeas" title="${pi?`Claude drafts campaign ideas for the ${missing} creator${missing===1?"":"s"} with none, from the brief and their channels. For this list only.`:`Claude drafts typical ideas for the ${missing} creator${missing===1?"":"s"} with none, from their channels. They become each creator's standard ideas.`}">Draft ideas for ${missing}</button>`:""}${acceptButton()}</div>${packageSummary()}`;
      $$typeWire(); $$ideasWire();
      const di=$("#draftIdeas"); if(di) di.onclick=()=>pi?draftCampaignIdeas(di):draftIdeas(di);
      const lb=$("#lockBtn"); if(lb) lb.onclick=()=>toggleLock(lb.dataset.lock==="1");
      const ab=$("#acceptBtn"); if(ab) ab.onclick=()=>acceptChanges(ab);
      [$("#viewsBtn"),$("#viewsBtn2")].forEach(vb=>{ if(vb) vb.onclick=async()=>{ const est=vb.dataset.est==="1"; if(est===!!BRAND.list.estViews) return; try{ applyBrand(await post({op:"list-label",slug:LIST_SLUG,est})); toast(est?"Brands now see Estimated Views":"Brands now see View Guarantee"); }catch(e){ toast(e.message,true); } }; });
      return;
    }
    b.className="banner"; b.style.display="";
    b.innerHTML=`Signed in as <b>${esc(TEAM.email)}</b> · ${mode==="team"
      ?"<span class=\"longhint\">Blue columns are DFT-only. Click an underlined number to change what brands see, or the eye to show or hide a creator. Drag the ⠿ handles to move rows and columns, or a column's edge to resize it.</span><span class=\"shorthint\">Tap an underlined number to change what brands see, or the eye to show or hide a creator.</span>"
      :(listEdit()?`<b>“${esc(BRAND.list.title)}” numbers:</b><span class="longhint"> click an underlined number to change videos, views or prices for this list only. The main rate card and other lists stay as they are.</span><span class="shorthint"> tap an underlined number to change it for this list only.</span> <a class="bbtn" href="/?edit=${encodeURIComponent(LIST_SLUG)}">Add / remove creators</a>`+lockButton()+viewsButton()+acceptButton():"Brand preview: exactly what brands see.")}${listEdit()?packageSummary():'<span class="spacer"></span>'}<a href="/auth/signout" style="text-decoration:underline;margin-left:${listEdit()?"14px":"0"}">Sign out</a>`;
    const lb=$("#lockBtn"); if(lb) lb.onclick=()=>toggleLock(lb.dataset.lock==="1");
    const ab=$("#acceptBtn"); if(ab) ab.onclick=()=>acceptChanges(ab);
    const vb=$("#viewsBtn"); if(vb) vb.onclick=async()=>{ const est=vb.dataset.est==="1"; try{ applyBrand(await post({op:"list-label",slug:LIST_SLUG,est})); toast(est?"Brands now see Estimated Views":"Brands now see View Guarantee"); }catch(e){ toast(e.message,true); } };
  } else if(BRAND&&BRAND.list){
    b.className="banner list brandbar"; b.style.display="";
    b.innerHTML=brandBar();
    const sp=$("#sendPicks"); if(sp) sp.onclick=()=>sendPicks(sp);
  } else b.style.display="none";
}
// The brand-facing bar (Tom, 15 Oct 2026, "very untidy", then "I don't think we need any of
// that"): just the package totals and the Send button on one aligned row, with room around it.
// The list title is already in the header and the how-to is in the email.
function brandBar(){
  return `<div class="bb-foot">${packageSummary()}<button class="btn sendpicks" id="sendPicks">Send my picks to Digital Fox Talent</button></div>`;
}
// Send my picks (Tom, 15 Oct 2026): a clear way for a brand to finish. Waits for any tick still saving, then
// tells our team straight away (op brand-submit) and thanks the brand.
async function sendPicks(btn){
  const all=GROUPS.reduce((a,g)=>a.concat((BRAND&&BRAND.groups[g.id])||[]),[]);
  const ok=all.filter(c=>c.fb&&c.fb.ok).length;
  if(!all.some(c=>c.fb&&(c.fb.ok||c.fb.no||c.fb.note))){ toast("Tick \u201cApprove?\u201d on the creators you would like to book first.",true); return; }
  btn.disabled=true; btn.textContent="Sending...";
  try{ await listQ; await post({op:"brand-submit",slug:LIST_SLUG}); btn.textContent="Sent. Thank you!";
    toast(ok?`Thank you! We have your ${ok} pick${ok===1?"":"s"} and will confirm with ${ok===1?"the creator":"the creators"} shortly.`:"Thank you! We have your feedback and will be in touch shortly."); }
  catch(e){ btn.disabled=false; btn.textContent="Send my picks to Digital Fox Talent"; toast(e.message,true); }
}
function renderTabs(){
  const onList=!!(BRAND&&BRAND.list&&mode!=="team");
  const vis=GROUPS.filter(g=>(PAYLOAD.groups[g.id]||[]).length||!(BRAND&&BRAND.list));
  if(!vis.find(g=>g.id===activeTab)&&vis.length) activeTab=vis[0].id;
  // Saved lists (Tom, 6 Oct 2026): platforms with no creators on the list have no tab, and
  // a list on one platform has no tab bar at all. Signed in, each tab of a list with
  // several platforms has an x that takes that platform's creators off the list.
  $("#tabs").style.display=""; // always show the platform tab, even on a one-platform list, so brands know where the posts go (George, 13 Oct 2026)
  const canRemove=listEdit()&&vis.length>1;
  $("#tabs").innerHTML=vis.map(g=>`<button class="tab ${g.id===activeTab?"active":""}" data-g="${g.id}"${g.tip?` title="${esc(g.tip)}"`:""}>${esc(g.label)}<span class="n">${(PAYLOAD.groups[g.id]||[]).length}</span>${canRemove?`<span class="x" data-g="${g.id}" title="Take ${esc(g.label)} off this list">&times;</span>`:""}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.g; sortKey=null; renderTabs(); render(); $("#scroll").scrollTop=0; if(isMobile()) window.scrollTo(0,0);});
  $("#tabs").querySelectorAll(".x").forEach(x=>x.onclick=e=>{
    e.stopPropagation();
    if(!x.classList.contains("confirm")){ x.classList.add("confirm"); x.textContent="Remove?"; setTimeout(()=>{ if(x.isConnected){ x.classList.remove("confirm"); x.innerHTML="&times;"; } },4000); return; }
    removeTabFromList(x.dataset.g);
  });
}
async function removeTabFromList(gid){
  const l=((TEAM&&TEAM.lists)||[]).find(x=>x.slug===LIST_SLUG); if(!l) return;
  const drop=new Set((BRAND.groups[gid]||[]).map(c=>String(c.id)));
  const ids=l.ids.map(String).filter(id=>!drop.has(id));
  if(!ids.length) return;
  const label=(GROUPS.find(g=>g.id===gid)||{}).label||"That tab";
  try{
    await listSave({op:"list-remove",slug:LIST_SLUG,ids:[...drop]});
    l.ids=ids;
    toast(label+" taken off this list. Add creators back from the DFT view.");
  }catch(e){}
}
function applyBrand(p){
  BRAND=p; if(!TEAM) applyLayout(p);
  $("#subtitle").textContent=p.list&&p.list.press
    ?"A selection from our roster, with typical campaign ideas for each creator"
    :p.list&&p.list.lock
    ?`Prices fixed for this campaign (set ${fmtDate(p.list.lock.on)}) · a selection from our roster`
    :`Rates valid for ${p.quarter} · ${p.list?"a selection from our roster":"updated once a quarter"} · click the arrow beside a channel to see its specific shows`;
  if(p.list) $("#title").textContent=p.list.title;
  if(mode!=="team"){ PAYLOAD=BRAND; renderBanner(); renderTabs(); render(); }
}
async function loadBrand(bust){
  // bust: signed-in team members on a list page fetch past the edge cache, so they get
  // the copy that marks list-only prices.
  // Signed in, the main roster is fetched past the edge copy too, so Brand preview always
  // shows the latest numbers (Tom, 12 Oct 2026).
  const url=LIST_SLUG?"/api/roster?list="+encodeURIComponent(LIST_SLUG)+(bust?"&t="+Date.now():""):"/api/roster"+(bust?"?t="+Date.now():"");
  const r=await fetch(url,{headers:{accept:"application/json"}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"Could not load the roster right now.");
  if(bust) loadBrand.busted=true; else if(loadBrand.busted) return; // keep the team copy
  applyBrand(j);
}
async function loadTeam(fresh){
  const r=await fetch("/api/roster?view=team"+(fresh?"&fresh=1":""),{headers:{accept:"application/json"},credentials:"same-origin",cache:"no-store"});
  if(r.status===401) return false;
  if(!r.ok) throw new Error("team view unavailable");
  const first=!TEAM;
  TEAM=await r.json();
  applyLayout(TEAM);
  $("#teamTools").style.display="inline-flex"; $("#signin").style.display="none";
  if(first&&!LIST_SLUG) mode="team";
  if(fresh||(first&&LIST_SLUG)){ try{ await loadBrand(true); }catch(_){} }
  else if(first) loadBrand(true).catch(()=>{}); // main page: swap the brand copy for the latest, in the background
  setMode(mode==="brand"&&LIST_SLUG?"edit":mode);
  return true;
}
async function load(){
  const team=loadTeam(false).catch(()=>false);
  try{ await loadBrand(); }
  catch(e){ if(!(await team)){ $("#scroll").innerHTML=`<div class="state"><div>${esc(e.message)}</div></div>`; $("#count").textContent=""; } }
  const signedIn=await team;
  if(!signedIn&&!LIST_SLUG) $("#signin").style.display="";
  const editSlug=new URLSearchParams(location.search).get("edit");
  if(signedIn&&editSlug&&!LIST_SLUG){ const l=((TEAM&&TEAM.lists)||[]).find(x=>x.slug===editSlug); if(l) chooseCreatorsFor(l); history.replaceState(null,"","/"); }
  if(/signin=failed/.test(location.search)) toast("Sign-in did not complete. Please try again.",true);
}

// ---------- toolbar ----------
$("#search").addEventListener("input",e=>{query=e.target.value; render();});
$("#vTeam").addEventListener("click",()=>{ if(LIST_SLUG&&TEAM&&BRAND&&BRAND.list){ location.href="/"; return; } setMode("team"); });
$("#vBrand").addEventListener("click",()=>setMode("brand"));
$("#vEdit").addEventListener("click",()=>setMode("edit"));
$("#listsBtn").addEventListener("click",e=>{e.stopPropagation(); renderPanel(); $("#panel").classList.toggle("on"); const q=$("#lsq"); if(q&&$("#panel").classList.contains("on")&&!isMobile()) q.focus();});
document.addEventListener("click",e=>{ if(!e.target.closest("#panel")&&!e.target.closest("#listsBtn")) $("#panel").classList.remove("on"); });
$("#saveList").addEventListener("click",()=>saveList(false));
$("#pressNew").addEventListener("change",()=>{ totKey=""; queueTotals(); });
$("#saveAsNew").addEventListener("click",()=>saveList(true));
$("#clearSel").addEventListener("click",()=>{picked.clear(); editingList=null; $("#listName").value=""; $("#selMsg").textContent=""; renderBanner(); render();});
$("#resetLayout").addEventListener("click",()=>{
  try{ localStorage.removeItem(LAYOUT_KEY); }catch(e){}
  myLayout=null; layoutDirty=false; sortKey=null; $("#saveCols").style.display="none"; $("#resetLayout").style.display="none";
  applyLayout((mode==="team"?TEAM:BRAND)||{}); render();
});
$("#saveCols").addEventListener("click",async()=>{
  try{ await post({op:"columns",columns:colOrder||BRAND_COLS.map(c=>c.key),rows:rowOrder,widths:colWidths}); layoutDirty=false; $("#saveCols").style.display="none"; toast("Layout saved for everyone"); }
  catch(e){ toast(e.message,true); }
});

function csvEscape(v){ v=(v==null?"":String(v)); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
$("#exportCsv").addEventListener("click",()=>{
  const cols=columns().filter(c=>c.key!=="sel"&&c.key!=="status");
  const header=cols.map(c=>c.key==="name"?"Creator (@handle)":c.head.replace(" ✎",""));
  const rows=currentList().map(c=>cols.map(col=>{
    if(col.key==="name") return dispHandle(c);
    const v=cellVal(c,col);
    if(col.fmt==="money"||col.fmt==="int") return v==null?"":Math.round(v);
    return v==null?"":v;
  }));
  const csv=[header,...rows].map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="dft-roster-"+((GROUPS.find(g=>g.id===activeTab)||{}).label||"roster").toLowerCase().replace(/[^a-z0-9]+/g,"-")+(mode==="team"?"-dft":"")+".csv";
  document.body.appendChild(a); a.click(); a.remove();
});

load();
</script>
