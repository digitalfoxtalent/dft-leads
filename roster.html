<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DFT Creator Roster</title>
<link rel="icon" type="image/png" href="https://digitalfoxtalent.com/dft/favicon.png">
<style>
  :root{
    color-scheme: light;
    --orange:#ff8800; --charcoal:#15110e; --peach:#fceedf; --namebg:#f9cb9c;
    --child:#4a4640; --grid:#e6d9c8; --muted:#8a7d70; --bg:#f4f1ec;
    --team:#2f5d8a; --teambg:#eaf1f8; --ok:#2f7d4f; --hide:#b23a2a;
    --font:"Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --rowh:36px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:var(--font); color:var(--charcoal); background:var(--bg); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:var(--font); }
  .app{ display:flex; flex-direction:column; height:100vh; }

  /* Toolbar */
  .toolbar{ display:flex; align-items:center; gap:10px; padding:12px 16px; background:#fff; border-bottom:1px solid #e9e0d3; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .mark img{ height:26px; width:auto; display:block; }
  .brand .t{ font-size:15px; font-weight:700; letter-spacing:-.2px; }
  .brand .s{ font-size:11px; color:var(--muted); font-weight:500; margin-top:1px; }
  .spacer{ flex:1; }
  .count{ font-size:11.5px; font-weight:600; color:var(--muted); }
  .search{ position:relative; }
  .search input{ font-family:var(--font); font-size:12.5px; color:var(--charcoal); border:1px solid #e4d8c7; background:#fff; border-radius:8px; padding:8px 12px 8px 31px; outline:none; width:220px; max-width:100%; }
  .search input:focus{ border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,136,0,.12); }
  .search svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .btn{ border:1px solid #e4d8c7; background:#fff; color:#a85f00; font-size:11.5px; font-weight:600; border-radius:8px; padding:7px 10px; cursor:pointer; white-space:nowrap; }
  .btn:hover{ background:#fff5ea; }
  .btn.team{ color:var(--team); border-color:#c9d8e8; }
  .btn.team:hover{ background:var(--teambg); }
  .btn.primary{ background:var(--orange); border-color:var(--orange); color:var(--charcoal); }
  .btn.primary:hover{ background:#ff9a2e; }
  .signin{ font-size:11px; color:var(--muted); font-weight:600; }
  .signin:hover{ color:var(--charcoal); text-decoration:underline; }
  .seg{ display:inline-flex; border:1px solid #c9d8e8; border-radius:8px; overflow:hidden; }
  .seg button{ border:0; background:#fff; color:var(--team); font-size:11.5px; font-weight:600; padding:7px 10px; cursor:pointer; }
  .seg button.on{ background:var(--team); color:#fff; }

  /* Banner (team identity / saved list) */
  .banner{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 16px; font-size:12px; background:var(--teambg); color:var(--team); border-bottom:1px solid #d5e2ef; }
  .banner.list{ background:#fff5ea; color:#8a4a00; border-bottom-color:#f0dcc2; }
  .banner.warn{ background:#fff4d6; color:#6e4a00; border-bottom-color:#efd98f; }
  .banner .bbtn{ display:inline-block; border:1px solid currentColor; border-radius:7px; padding:3px 9px; font-weight:700; background:#fff; color:inherit; cursor:pointer; font-size:11.5px; text-decoration:none; }
  .banner .bbtn:hover{ background:#fffaf0; }
  #panel .hint{ font-size:11px; color:var(--muted); line-height:1.45; margin-top:10px; border-top:1px solid #eee3d4; padding-top:8px; }
  .banner b{ font-weight:700; }
  .banner .pkg{ margin-left:auto; display:flex; gap:14px; flex-wrap:wrap; font-weight:600; }
  .banner .pkg span b{ font-weight:800; color:#5a3000; }

  /* Pitch-list totals (saved lists only) */
  tfoot td{ position:sticky; bottom:0; z-index:2; background:#1a1a1a; color:#fff; font-weight:700; border-color:#333; }
  tfoot td.name{ z-index:3; background:#1a1a1a; text-align:left; }
  tfoot td .sub{ display:block; font-size:10px; font-weight:600; color:#ffb800; line-height:1.1; }

  /* Grid */
  .scroll{ flex:1; overflow:auto; background:#fff; }
  table{ border-collapse:separate; border-spacing:0; font-size:12.5px; table-layout:fixed; }
  th,td{ border-right:1px solid var(--grid); border-bottom:1px solid var(--grid); padding:0 10px; height:var(--rowh); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; vertical-align:middle; }
  thead th{ position:sticky; top:0; z-index:3; background:var(--orange); color:var(--charcoal); font-weight:600; box-shadow:0 1px 0 rgba(0,0,0,.06); cursor:pointer; user-select:none; }
  thead th:hover{ background:#ff9a2e; }
  thead th.tcol{ background:#d6e3f0; color:var(--team); }
  thead th.tcol:hover{ background:#c7d9eb; }
  thead th.dragging{ opacity:.45; }
  thead th.drop-l{ box-shadow: inset 3px 0 0 0 var(--charcoal); }
  thead th.drop-r{ box-shadow: inset -3px 0 0 0 var(--charcoal); }
  .rsz{ position:absolute; top:0; bottom:0; right:0; width:9px; cursor:col-resize; z-index:6; }
  .rsz::after{ content:""; position:absolute; top:6px; bottom:6px; right:2px; width:2px; border-radius:2px; background:transparent; }
  .rsz:hover::after, .rsz.on::after{ background:var(--charcoal); }
  body.resizing, body.resizing *{ cursor:col-resize !important; user-select:none !important; }
  .sortcar{ font-size:8px; margin-left:5px; vertical-align:middle; }
  .sortcar.dim{ opacity:0; }
  thead th.sorted{ box-shadow: inset 0 -3px 0 0 var(--charcoal); }
  thead th:hover .sortcar.dim{ opacity:.4; }
  th.name, td.name{ position:sticky; left:0; z-index:2; text-align:left; box-shadow:1px 0 0 var(--grid); }
  thead th.name{ z-index:4; }
  th.sel, td.sel{ position:sticky; left:0; z-index:2; padding:0; }
  thead th.sel{ z-index:4; }
  .hasSel th.name, .hasSel td.name{ left:34px; }

  tr.chan > td{ background:var(--peach); }
  tr.chan > td.name{ background:var(--namebg); font-weight:600; }
  tr.chan > td.sel{ background:var(--namebg); }
  tr.chan{ cursor:pointer; }
  tr.chan:hover > td{ background:#fbe6cf; }
  tr.chan:hover > td.name, tr.chan:hover > td.sel{ background:#f6c191; }
  tr.chan.hidden > td{ background:#f3efea; color:#8c847b; }
  tr.chan.hidden > td.name, tr.chan.hidden > td.sel{ background:#e9e2d9; }
  tr.chan.picked > td.sel, tr.chan.picked > td.name{ background:#ffd9a8; }
  tr.show > td{ background:#fff; color:var(--child); }
  tr.show > td.name{ background:#fff; }
  tr.show.hidden > td{ color:#a39b92; background:#faf8f5; }
  tr.show .nmwrap{ padding-left:22px; }
  td.tcol{ background-clip:padding-box; }
  tr.chan > td.tcol{ background:#f4f8fc; }
  tr.chan.hidden > td.tcol{ background:#eef1f4; }

  .nmwrap{ display:flex; align-items:center; gap:7px; }
  .chev{ flex:0 0 auto; width:20px; height:20px; display:grid; place-items:center; color:#b45c00; border-radius:5px; transition:transform .18s, background .15s; }
  tr.chan:hover .chev:not(.spacer-ic){ background:rgba(180,92,0,.12); }
  .chev.spacer-ic{ visibility:hidden; }
  tr.chan.open .chev{ transform:rotate(90deg); }
  .av{ flex:0 0 auto; width:30px; height:30px; border-radius:50%; object-fit:cover; background:#fff; border:1px solid rgba(0,0,0,.08); }
  .avx{ flex:0 0 auto; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:#fff; color:#a85f00; font-size:13px; font-weight:700; border:1px solid #f0d3ac; }
  .nmtext{ overflow:hidden; white-space:normal; overflow-wrap:anywhere; line-height:1.3; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; padding:4px 0; }
  .nmtext a:hover{ text-decoration:underline; }
  .arrow{ color:var(--orange); margin-right:5px; }
  .exlink{ color:#c26a00; font-weight:600; }
  .exlink:hover{ text-decoration:underline; }
  td.wide{ text-align:left; }
  td.wide.clickable{ cursor:pointer; }
  td.wide{ white-space:normal; padding-top:6px; padding-bottom:6px; }
  .clamp{ display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; line-height:1.4; overflow-wrap:anywhere; }
  td.wide.exp .clamp{ -webkit-line-clamp:unset; display:block; }
  /* Every channel row is as tall as three lines of About text, so a creator with a short
     description is not a squashed row (Tom, 10 Oct 2026). Expanded text still grows. */
  tr.chan > td.wide{ height:calc(4.2em + 13px); }
  .tag{ display:inline-block; font-size:10.5px; font-weight:800; color:#fff; background:#c26a00; border:1px solid #c26a00; border-radius:999px; padding:2px 9px; margin-left:8px; cursor:pointer; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  tr.chan:hover .tag{ background:#a85600; border-color:#a85600; }
  tr.chan.open .tag{ background:#fff; color:#a85f00; border-color:#e8b77a; box-shadow:none; }
  .pill{ display:inline-block; font-size:10.5px; font-weight:700; border-radius:999px; padding:2px 8px; }
  .pill.ok{ background:#e3f3e9; color:var(--ok); }
  .pill.no{ background:#f9e3df; color:var(--hide); }
  .pill.bundle{ background:#e8eefc; color:#2b4a9a; }
  .pill.prov{ background:#fff1d6; color:#8a5a00; margin-left:4px; }
  td.edit{ cursor:text; color:var(--team); font-weight:600; text-decoration:underline dotted #9db6cf; text-underline-offset:3px; }
  td.edit:hover{ background:#e1ecf7 !important; }
  td.edit input{ width:100%; font:inherit; text-align:center; border:1px solid var(--team); border-radius:5px; padding:3px; }
  td.edit.tcol{ color:var(--team); }
  td.saving{ opacity:.5; }
  .grip{ flex:0 0 auto; cursor:grab; user-select:none; color:#a87a4a; font-size:14px; line-height:1; }
  thead th{ position:sticky; }
  thead th.movable{ cursor:grab; padding-left:18px; }
  .hgrip{ position:absolute; left:5px; top:50%; transform:translateY(-50%); color:rgba(21,17,14,.45); font-size:13px; }
  thead th.movable:hover .hgrip{ color:var(--charcoal); }
  tr.chan:hover .grip{ color:#a85f00; }
  tr.chan.dragging > td{ opacity:.45; }
  tr.chan.drop-before > td{ box-shadow: inset 0 2px 0 0 var(--orange); }
  tr.chan.drop-after > td{ box-shadow: inset 0 -2px 0 0 var(--orange); }
  button.eye{ margin-left:auto; flex:0 0 auto; display:inline-flex; align-items:center; gap:1px; border:1px solid #e4d8c7; background:#fff; border-radius:6px; padding:2px 4px; cursor:pointer; }
  button.eye b{ font-size:10px; }
  button.eye:hover{ background:#fff5ea; }
  .why{ display:inline-block; max-width:110px; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; font-size:11px; color:var(--hide); margin-left:6px; }
  input.pick{ width:15px; height:15px; accent-color:var(--orange); cursor:pointer; }

  /* Tabs */
  .tabbar{ display:flex; align-items:stretch; gap:2px; background:#fff; border-top:1px solid #e9e0d3; padding:0 10px; min-height:40px; overflow-x:auto; }
  .tab{ border:0; background:transparent; font-size:12.5px; font-weight:600; color:var(--muted); padding:0 16px; cursor:pointer; display:flex; align-items:center; gap:7px; border-top:3px solid transparent; white-space:nowrap; }
  .tab .n{ font-size:10.5px; font-weight:700; opacity:.65; }
  .tab:hover{ color:var(--charcoal); background:#faf6f0; }
  .tab.active{ color:var(--charcoal); border-top-color:var(--orange); background:#fff5ea; }
  .tab .x{ margin-left:2px; font-size:13px; line-height:1; color:#b0a596; padding:2px 4px; border-radius:4px; }
  .tab .x:hover{ color:#fff; background:var(--hide); }
  .tab .x.confirm{ color:#fff; background:var(--hide); font-size:10.5px; font-weight:700; }

  /* Selection bar */
  .selbar{ display:none; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 16px; background:var(--charcoal); color:#fff; font-size:12.5px; }
  .selbar.on{ display:flex; }
  .selbar input{ font-family:var(--font); font-size:12.5px; border:0; border-radius:7px; padding:7px 10px; width:240px; max-width:100%; }
  .selbar .btn{ background:#fff; }
  .selbar .msg{ color:#ffcf99; font-weight:600; }

  /* Lists panel */
  .panel{ position:fixed; right:16px; top:60px; width:420px; max-width:calc(100vw - 32px); max-height:70vh; overflow:auto; background:#fff; border:1px solid #e4d8c7; border-radius:12px; box-shadow:0 18px 50px rgba(0,0,0,.18); z-index:20; display:none; }
  .panel.on{ display:block; }
  .panel h3{ margin:0; padding:14px 16px 8px; font-size:13px; }
  .panel .li{ padding:10px 16px; border-top:1px solid #f1e8dc; font-size:12px; }
  .panel .li .tt{ font-weight:700; font-size:12.5px; }
  .panel .li .mm{ color:var(--muted); font-size:11px; margin:2px 0 6px; }
  .panel .li .acts{ display:flex; gap:6px; flex-wrap:wrap; }
  .panel .empty{ padding:12px 16px 16px; color:var(--muted); font-size:12px; }

  .was{ display:block; font-size:10.5px; font-weight:600; color:#2f7d4f; line-height:1.2; margin-top:2px; }
  .was s{ color:var(--muted); font-weight:500; margin-right:4px; }
  .ckc{ display:inline-flex; align-items:center; justify-content:center; }
  .ckc input{ width:16px; height:16px; accent-color:var(--ok); cursor:pointer; }
  .ckc.disc input{ accent-color:var(--orange); }
  .stg{ display:inline-flex; flex-direction:column; gap:2px; font-size:11px; font-weight:600; line-height:1.2; text-align:left; }
  .stg label{ display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; }
  .stg input{ width:14px; height:14px; margin:0; cursor:pointer; accent-color:var(--orange); }
  .stg label:last-child input{ accent-color:var(--ok); }
  .stg label.bap input{ accent-color:#2a6fb0; }
  .stg label.bap .fbn{ padding:0 6px; font-size:10px; margin-left:2px; }
  .stg label.dft{ cursor:default; }
  .stg label.dft input{ cursor:default; pointer-events:none; }
  .dec{ display:flex; align-items:center; gap:4px; margin:1px 0 1px 1px; }
  .dbt{ font:inherit; font-size:10.5px; font-weight:700; border-radius:999px; padding:1px 8px; cursor:pointer; line-height:1.35; background:#fff; white-space:nowrap; }
  .dbt.yes{ border:1.5px solid var(--ok); color:var(--ok); }
  .dbt.yes.on{ background:var(--ok); color:#fff; }
  .dbt.no{ border:1.5px solid #b23a2a; color:#b23a2a; }
  .dbt.no.on{ background:#b23a2a; color:#fff; }
  .dec .fbn{ padding:1px 7px; font-size:10.5px; }
  .stg label.mine{ color:#1f4f80; }
  .pill.conf{ background:#e3f3e9; color:var(--ok); }
  .fbw{ display:inline-flex; flex-direction:column; align-items:center; gap:4px; }
  .fbr{ display:inline-flex; gap:5px; }
  .fba,.fbn{ font:inherit; font-size:11px; font-weight:700; border-radius:999px; padding:3px 9px; cursor:pointer; line-height:1.2; white-space:nowrap; }
  .fba{ border:1.5px solid var(--ok); background:#fff; color:var(--ok); }
  .fba:hover{ background:#e3f3e9; }
  .fba.on{ background:var(--ok); color:#fff; }
  .fbn{ border:1.5px solid #c9b8a6; background:#fff; color:#6b5c4d; }
  .fbn:hover,.fbn.has{ border-color:var(--orange); color:#a85f00; background:#fff7ee; }
  .bfb{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ok); }
  .bfb .fbn{ padding:1px 7px; font-size:10.5px; }
  #fbpop{ position:fixed; z-index:50; width:280px; background:#fff; border:1px solid #e2d6c8; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.18); padding:12px; display:none; }
  #fbpop.on{ display:block; }
  #fbpop b{ display:block; font-size:12.5px; margin-bottom:6px; }
  #fbpop textarea{ width:100%; box-sizing:border-box; min-height:84px; font:inherit; font-size:13px; border:1px solid #d8c9b8; border-radius:6px; padding:7px; resize:vertical; }
  #fbpop .ro{ font-size:13px; white-space:pre-wrap; line-height:1.4; max-height:200px; overflow:auto; }
  #fbpop .acts{ display:flex; gap:6px; justify-content:flex-end; margin-top:8px; }
  .banner .hint{ font-weight:600; margin-left:10px; }
  .cbar{ position:fixed; left:50%; bottom:58px; transform:translateX(-50%) translateY(12px); display:flex; align-items:center; gap:12px; max-width:calc(100vw - 32px); background:var(--charcoal); color:#fff; font-size:12.5px; padding:10px 12px 10px 16px; border-radius:12px; box-shadow:0 12px 34px rgba(0,0,0,.28); z-index:31; opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; }
  .cbar.on{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  .cbar .ct{ line-height:1.4; } .cbar .ct b{ font-weight:700; } .cbar .cs{ display:block; color:#cfc6bb; font-size:11px; }
  .cbar button{ font-family:var(--font); font-size:12px; font-weight:700; border-radius:8px; padding:7px 12px; cursor:pointer; border:1px solid #5a524a; background:transparent; color:#fff; white-space:nowrap; }
  .cbar button.go{ background:var(--orange); border-color:var(--orange); color:var(--charcoal); }
  .toast{ position:fixed; left:50%; bottom:64px; transform:translateX(-50%); background:var(--charcoal); color:#fff; font-size:12.5px; font-weight:600; padding:10px 16px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:30; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on{ opacity:1; }
  .toast.err{ background:var(--hide); }

  .state{ display:grid; place-items:center; height:100%; color:var(--muted); text-align:center; padding:24px; }
  .spinner{ width:24px; height:24px; border:3px solid #f0dcc2; border-top-color:var(--orange); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (max-width:640px){
    .toolbar{ padding:10px 16px; }
    .brand .s{ display:none; }
    .search input{ width:160px; }
  }
</style>

<div class="app">
  <div class="toolbar">
    <div class="brand">
      <div class="mark"><img src="https://df-cdn.b-cdn.net/GeneralLendingConfigs/landing_logo/DigitalFoxTalent-TextLogoBLACK-VECTOR.svg" alt="Digital Fox Talent"></div>
      <div><div class="t" id="title">Creator Roster</div><div class="s" id="subtitle">&nbsp;</div></div>
    </div>
    <div class="spacer"></div>
    <div class="count" id="count">Loading…</div>
    <span id="teamTools" style="display:none;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="seg"><button id="vTeam" class="on" title="Live numbers, edits and hidden creators">DFT view</button><button id="vEdit" style="display:none" title="Change this list's videos, prices, stages and order">Edit list</button><button id="vBrand" title="Exactly what brands see">Brand preview</button></span>
      <button class="btn team" id="listsBtn">Saved lists</button>
      <button class="btn team" id="saveCols" style="display:none" title="Every viewer, brands included, gets this row and column order and these column widths">Save layout for everyone</button>
    </span>
    <button class="btn" id="resetLayout" style="display:none" title="Go back to the standard order and widths">Reset layout</button>
    <button class="btn" id="exportCsv" title="Export this tab as a CSV">Export CSV</button>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search creator, host, category…" autocomplete="off">
    </label>
    <a class="signin" id="signin" href="/signin" style="display:none">DFT sign in</a>
  </div>
  <div class="banner" id="banner" style="display:none"></div>

  <div class="scroll" id="scroll">
    <div class="state"><div><div class="spinner"></div>Loading roster…</div></div>
  </div>

  <div class="selbar" id="selbar">
    <span id="selCount"></span>
    <input id="listName" placeholder="Name this list, e.g. Marvel pitch - Disney" maxlength="80">
    <button class="btn" id="saveList">Save list</button>
    <button class="btn" id="saveAsNew" style="display:none">Save as new</button>
    <button class="btn" id="clearSel">Clear</button>
    <span class="msg" id="selMsg"></span>
  </div>
  <div class="tabbar" id="tabs"></div>
</div>
<div class="panel" id="panel"></div>
<div class="toast" id="toast"></div>
<div class="cbar" id="cbar"><span class="ct" id="cbarText"></span><button id="cbarNo">Cancel</button><button class="go" id="cbarYes">Update</button></div>

<script>
const GROUPS=[
  {id:"topics",         label:"YouTube Channels", kind:"long"},
  {id:"group_mm4av3kr", label:"YouTube Shorts",   kind:"short"},
  {id:"group_mm4a1fe0", label:"Instagram",        kind:"short"},
  {id:"group_mm4bd5tk", label:"TikTok",           kind:"short"},
  {id:"group_mm7yw8cy", label:"Snapchat",         kind:"short"},
];
const AFTER={fee:"rate",total:"fee",rights:"total"};
const FOLLOWER_TABS=new Set(["group_mm4a1fe0","group_mm4bd5tk","group_mm7yw8cy"]);
const SHORTS_GROUP="group_mm4av3kr";

const kindOf=()=>(GROUPS.find(g=>g.id===activeTab)||{}).kind||"long";
const dispName=n=>RENAME[n]||n;
function dispHandle(c){
  const h=String(c.handle||"").trim();
  if(!h) return dispName(c.name);
  const at=(h.charAt(0)==="@"?h:"@"+h).toLowerCase(); // handles always lowercase (Tom, 8 Oct 2026)
  return (/[-–]\s*shorts\s*$/i.test(c.name)&&activeTab!==SHORTS_GROUP)?at+" · Shorts":at;
}

// Column set for the current tab and mode.
function brandColsFor(){
  const k=kindOf();
  const team=mode==="team";
  // Short form (Shorts / Instagram / TikTok / Snapchat), Tom 8 Oct 2026: brands see the
  // View Estimate, a rate at $25 CPM, the $3,000 content production fee, the Total Rate and
  // the usage-rights note. Never the CPM. Signed in, the team also sees and edits the CPM.
  const showShortCpm=team||listEdit();
  let cols=BRAND_COLS.filter(c=>{
    // Saved lists: the team's Stage column, which brands see as "Your feedback".
    if(c.listOnly) return !!(BRAND&&BRAND.list&&mode!=="team");
    if(c.listEditOnly) return listEdit();
    if(c.shortOnly) return k!=="long";
    if(c.key==="vg") return true;
    if(c.key==="cpm"&&k!=="long") return showShortCpm;
    return !(c.longOnly&&k!=="long");
  });
  // Shorts / Instagram / TikTok for brands: no demographics, audience, ad types,
  // exclusivity, host or host gender columns (Tom, 6 Oct 2026). The DFT view keeps them.
  if(k!=="long"&&!team) cols=cols.filter(c=>!SHORT_HIDE.has(c.key));
  if(k!=="long") cols=cols.map(c=>{
    if(c.key==="vg") return Object.assign({},c,{head:"View Estimate",tip:"Estimated views per post, based on recent averages. An estimate, not a guarantee."});
    if(c.key==="rate") return Object.assign({},c,{head:"Publishing Rate",w:132,tip:"View Estimate x $25 CPM. The Production Rate is added in Total Rate."});
    if(c.key==="cpm") return Object.assign({},c,{t:1,tip:"DFT only, brands never see the CPM on this tab."});
    return c;
  });
  if(k==="long"&&estLong()) cols=cols.map(c=>c.key==="vg"?Object.assign({},c,{head:"Estimated Views",tip:"Estimated views across the videos, based on each channel's recent averages. An estimate, not a guarantee."}):c);
  if(team&&!baseLocked()) cols=cols.map(c=>{
    if(c.key==="vg") return Object.assign({},c,{w:146,edit:"vg",head:k==="long"?"View Guarantee ✎":"View Estimate ✎",tip:k==="long"?"Click to edit what brands see. Holds until the quarter resets.":"Brands see this as an estimate, not a guarantee. Rate = estimate x CPM ($25), plus the production fee ($3,000, or $5,000 from 100k views, $7,500 from 250k). Click to edit."});
    if(c.key==="cpm") return Object.assign({},c,{edit:"cpm",head:"CPM ✎",w:84,tip:k==="long"?"Click to edit what brands see. Holds until the quarter resets.":"Not shown to brands. Sets the rate. Click to edit."});
    // Number of videos brands are quoted (Tom, 9 Oct 2026). Clear it to go back to the
    // automatic bundle. Fewer videos than the minimum needs are still priced at $1,500.
    if(c.key==="minVideos"&&k==="long") return Object.assign({},c,{edit:"videos",head:"Videos ✎",w:112,tip:"Number of videos brands are quoted. View Guarantee = views per video x videos, Rate = that x CPM, minimum $1,500. Holds until the quarter resets. Clear the box to go back to the automatic count."});
    if(c.key==="rate") return Object.assign({},c,{tip:k==="long"?"Worked out from View Guarantee x CPM, minimum $1,500. Small YouTube rows are sold as a bundle of up to 10 videos instead of being lifted to $1,500.":"View Estimate x CPM ($25), no minimum. The production fee ($3,000, $5,000 from 100k views, $7,500 from 250k) is added in Total Rate."});
    return c;
  });
  // Signed in on a saved list's page (brand preview): the numbers are editable for THIS
  // list only. YouTube: view guarantee (per video) and CPM. Other tabs: the rate.
  // Every tab: View Guarantee / Estimate and CPM; short form also the production fee.
  if(listEdit()) cols=cols.map(c=>{
    const tip="Price for this list only. The roster and other lists are not changed. Clear the box to go back to the roster price.";
    if(c.key==="vg") return Object.assign({},c,{w:146,edit:"vg",head:k==="long"?(estLong()?"Estimated Views ✎":"View Guarantee ✎"):"View Estimate ✎",tip});
    if(c.key==="cpm") return Object.assign({},c,{edit:"cpm",head:k==="long"?"CPM ✎":"CPM ✎ (DFT only)",w:k==="long"?84:130,tip:k==="long"?tip:"Brands do not see this column. "+tip});
    if(c.key==="fee") return Object.assign({},c,{edit:"fee",head:"Production Rate ✎",w:160,tip});
    // Number of videos (Tom, 9 Oct 2026): the view guarantee and rate follow it. Fewer
    // videos than the $1,500 minimum needs are still priced at $1,500.
    if(c.key==="minVideos"&&k==="long") return Object.assign({},c,{edit:"videos",head:"Videos ✎",w:112,tip:"Number of videos for this list only. View Guarantee = views per video x videos, Rate = that x CPM, minimum $1,500. Clear the box to go back to the automatic count."});
    return c;
  });
  if(colOrder&&colOrder.length){
    const pos={}; colOrder.forEach((key,i)=>pos[key==="videos"?"adLength":key]=i);
    // A column added after an order was saved slots in beside its neighbour, not at the end.
    // The short-form price columns follow Rate: Rate, Content Production, Total Rate, Usage Rights.
    BRAND_COLS.forEach((c,i)=>{ if(pos[c.key]==null){ const a=AFTER[c.key]; if(a&&pos[a]!=null){ pos[c.key]=pos[a]+0.1; return; } const prev=BRAND_COLS.slice(0,i).reverse().find(p=>pos[p.key]!=null); pos[c.key]=prev?pos[prev.key]+0.5:-0.5; } });
    cols=cols.slice().sort((a,b)=>(pos[a.key]??999)-(pos[b.key]??999));
  }
  return cols.map(c=>c.key==="subs"&&FOLLOWER_TABS.has(activeTab)?Object.assign({},c,{head:"Followers"}):c);
}
// Column widths: drag a header's right edge (Tom, 8 Oct 2026). Kept per browser, and the

function sized(cols){ return cols.map(c=>c.key!=="sel"&&colWidths[c.key]?Object.assign({},c,{w:colWidths[c.key]}):c); }
function columns(){
  const name={key:"name",head:"Creator / Shows",w:280,cls:"name"};
  if(mode!=="team") return sized([name].concat(brandColsFor()));
  // Signed in: the same columns in the same (movable) order brands see, with the blue
  // DFT-only block slotted in straight after the last of Rate / View Guarantee / CPM.
  // (These used to be pinned, which made dragging them look like it did nothing.)
  const bc=brandColsFor();
  const cut=Math.max(...["rate","vg","cpm","minVideos","fee","total"].map(k=>bc.findIndex(c=>c.key===k)));
  const tc=kindOf()==="long"?TEAM_COLS:TEAM_COLS.filter(c=>c.key!=="lcpm").map(c=>c.key==="lvg"?Object.assign({},c,{head:"Live Estimate",w:104}):c);
  return sized([{key:"sel",head:"",w:34,cls:"sel"},Object.assign({},name,{w:320})].concat(bc.slice(0,cut+1),tc,bc.slice(cut+1)));
}

function cellVal(c,col){
  switch(col.key){
    case "lavg": return c.live?c.live.avg:null;
    case "lvg": return c.live?c.live.vg:null;
    case "lrate": return c.live?c.live.rate:null;
    case "lcpm": return c.live?c.live.cpm:null;
    case "basis": return c.brand?((c.brand.quarter?c.brand.quarter+": ":"")+(c.brand.note||"")):"";
    default: return c[col.key];
  }
}
// The middle Stage step: the brand's Approve / Reject and a note.
function decisionRow(c,team){
  const ok=!!(c.fb&&c.fb.ok), no=!!(c.fb&&c.fb.no), note=(c.fb&&c.fb.note)||"";
  const noteBtn=team
    ?(note?`<button class="fbn ro has" data-id="${c.id}" title="${esc(note)}">Note</button>`:"")
    :`<button class="fbn${note?" has":""}" data-id="${c.id}" title="${note?esc(note):"Tell us why, or anything else we should know"}">${note?"Note ✎":"+ Note"}</button>`;
  return `<span class="dec"><button class="dbt yes${ok?" on":""}" data-id="${c.id}" data-d="yes" title="${team?"The brand approved this creator":"Approve this creator"}">${ok?"✓ Approved":"Approve"}</button><button class="dbt no${no?" on":""}" data-id="${c.id}" data-d="no" title="${team?"The brand rejected this creator":"Not for us"}">${no?"✗ Rejected":"Reject"}</button>${noteBtn}</span>`;
}
function fmtCell(c,col,isShow){
  if(col.key==="status") return statusCell(c,isShow);
  if(col.key==="confirmed"){
    if(isShow) return "";
    if(listEdit()){ const st=c.stage||(c.confirmed?"confirmed":"");
      // Stage (Tom, 10 Oct 2026), three steps: Approached, the brand's decision (approve or
      // reject, with a note), Confirmed. The team can set the decision for a brand that told
      // us another way.
      return `<span class="stg" onclick="event.stopPropagation()"><label title="We have reached out to this creator"><input type="checkbox" class="conf" data-id="${c.id}" data-st="approached" ${st?"checked":""}>Approached</label>${decisionRow(c,true)}<label title="Locked in for this campaign"><input type="checkbox" class="conf" data-id="${c.id}" data-st="confirmed" ${st==="confirmed"?"checked":""}>Confirmed</label></span>`; }
    // Brands (Tom, 10 Oct 2026): the same three steps. Approached and Confirmed are DFT's, shown
    // but not clickable; the middle step is theirs: Approve or Reject, and a note.
    const st=c.stage||(c.confirmed?"confirmed":"");
    return `<span class="stg" onclick="event.stopPropagation()"><label class="dft" title="Digital Fox Talent has reached out to this creator"><input type="checkbox" tabindex="-1" onclick="return false" ${st?"checked":""}>Approached</label>${decisionRow(c,false)}<label class="dft" title="Locked in by Digital Fox Talent"><input type="checkbox" tabindex="-1" onclick="return false" ${st==="confirmed"?"checked":""}>Confirmed</label></span>`;
  }
  if(col.key==="disc") return `<label class="ckc disc" onclick="event.stopPropagation()"><input type="checkbox" class="dsc" data-id="${c.id}"${isShow?' data-show="1"':""} ${c.disc?"checked":""} title="Discount: tick, then type a lower CPM"></label>`;
  if((col.key==="rate"||col.key==="total")&&c.wasRate&&(col.key==="rate"||c.kind!=="long")){
    const was=col.key==="rate"?c.wasRate:c.wasTotal;
    return `${money(cellVal(c,col))}<span class="was"><s>${money(was)}</s>${c.discPct}% off</span>`;
  }
  const v=cellVal(c,col);
  if(col.fmt==="money") return money(v);
  if(col.fmt==="money2") return money2(v);
  if(col.fmt==="int") return int(v);
  if(col.key==="minVideos") return v==null?"":(v>1?`<span class="pill bundle" title="${esc(v+" videos. "+(estLong()?"Estimated views":"View guarantee")+" and rate cover all "+v+(c.vgPer?" (about "+int(c.vgPer)+" views each)":""))}">${v} videos</span>`:"1");
  if(col.key==="simulcast") return v?`<span class="pill ok" title="Also on Spotify Video and podcast apps, included at this rate">${esc(v)}</span>`:"";
  if(col.key==="kit") return v?`<a class="exlink" href="${esc(v)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Audience ↗</a>`:"";
  if(col.key==="adEx") return v?`<a class="exlink" href="${esc(v)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Examples ↗</a>`:"";
  return esc(v);
}
function statusCell(c,isShow){
  const pill=c.show?`<span class="pill ok">Shown</span>`:`<span class="pill no" title="${esc(c.why)}">Hidden</span>`;
  const prov=c.brand&&c.brand.provisional?`<span class="pill prov" title="Not frozen yet: priced from today's average until tomorrow's snapshot">Provisional</span>`:"";
  const why=c.why?`<span class="why" title="${esc(c.why)}">${esc(c.why)}</span>`:"";
  return `${pill}${prov}${why}`;
}
function logoHtml(c){
  const letter=esc((dispHandle(c).replace(/^@/,"")[0]||"?").toUpperCase());
  return c.logo?`<img class="av" src="${esc(c.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=avx>${letter}</span>'">`:`<span class="avx">${letter}</span>`;
}
// Show-to-brands switch beside the name (DFT view only): Auto -> Always show -> Hide -> List only.
const EYE={"Auto":["Auto: brands see this unless it breaks the CPM cap","#8a7d70"],"Always show":["Always shown to brands","#2f7d4f"],"Hide":["Hidden from brands","#b23a2a"],"List only":["List only: can go on a saved list, never shown on the main rate card","#2a6fb0"]};
function eyeBtn(c,isShow){
  if(mode!=="team") return "";
  const o=c.override||"Auto", [t,col]=EYE[o]||EYE.Auto;
  const slash=o==="Hide"?'<line x1="3" y1="3" x2="21" y2="21"/>':"";
  return `<button class="eye" data-id="${c.id}" data-show="${isShow?1:0}" data-o="${o}" title="${t}. Click to change." style="color:${col}" onclick="event.stopPropagation()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>${slash}</svg>${o==="Always show"?'<b>+</b>':o==="List only"?'<b>L</b>':""}</button>`;

function nameCell(c){
  const has=(c.shows||[]).length;
  const chev=`<span class="chev ${has?"":"spacer-ic"}"${has?` title="${openSet.has(c.id)?"Hide":"Show"} this channel's ${has} show${has===1?"":"s"}, each with its own price"`:""}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></span>`;
  const dn=dispHandle(c), real=dispName(c.name);
  const ttl=(real&&real!==dn)?` title="${esc(real)}"`:"";
  const nm=c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(dn)}</a>`:esc(dn);
  // On a saved list only the team can reorder (the order is saved to the list); brands get no handle.
  const grip=(isPitch()&&!listEdit())?"":`<span class="grip" title="${listEdit()?"Drag to move this creator. Brands see the list in this order":"Drag to move this row"}">⠿</span>`;
  return `<div class="nmwrap">${grip}${chev}${logoHtml(c)}<span class="nmtext"${ttl}>${nm}</span>${eyeBtn(c,false)}</div>`;
}
function showNameCell(s){
  const nm=s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(s.name)}</a>`:esc(s.name);
  return `<div class="nmwrap"><span class="nmtext"><span class="arrow">&#8627;</span>${nm}</span>${eyeBtn(s,true)}</div>`;
}

function rowsFor(list,cols){
  let html="";
  list.forEach(c=>{
    const open=openSet.has(c.id);
    const cls=["chan",open?"open":"",mode==="team"&&!c.show?"hidden":"",picked.has(c.id)?"picked":""].join(" ");
    html+=`<tr class="${cls}" data-id="${c.id}">`;
    cols.forEach(col=>{
      let inner, cl=(col.cls||"")+(col.t?" tcol":"")+(col.edit?" edit":"")+(col.edit&&listEdit()&&c.custom?" custom":"");
      if(col.key==="sel") inner=`<input type="checkbox" class="pick" data-id="${c.id}" ${picked.has(c.id)?"checked":""} onclick="event.stopPropagation()" title="Add to a list">`;
      else if(col.key==="name") inner=nameCell(c);
      else inner=fmtCell(c,col,false);
      const title=(col.cls==="wide"&&cellVal(c,col))?` title="${esc(cellVal(c,col))}"`:"";
      if(col.cls==="wide"&&inner) inner=`<div class="clamp">${inner}</div>`;
      html+=`<td class="${cl}" data-k="${col.key}"${col.edit?` data-edit="${col.edit}" data-id="${c.id}"${listEdit()?' data-list="1"':""}`:""}${title}>${inner}</td>`;
    });
    html+=`</tr>`;
    if(open) (c.shows||[]).forEach(s=>{
      html+=`<tr class="show ${mode==="team"&&!s.show?"hidden":""}">`;
      cols.forEach(col=>{
        let inner="", cl=(col.cls||"")+(col.t?" tcol":"");
        if(col.key==="name") inner=showNameCell(s);
        else if(col.key==="rate"||col.key==="vg"||col.key==="cpm"||col.key==="minVideos"||col.key==="disc"||col.t) inner=fmtCell(s,col,true);
        if(col.edit&&(mode==="team"||listEdit())){ cl+=" edit"+(listEdit()&&s.custom?" custom":""); html+=`<td class="${cl}" data-edit="${col.edit}" data-id="${s.id}" data-show="1"${listEdit()?' data-list="1"':""}>${inner}</td>`; }
        else html+=`<td class="${cl}">${inner}</td>`;

      html+=`</tr>`;
    });

  return html;
}

function cmp(a,b){
  if(!sortKey) return 0;
  const col=columns().find(c=>c.key===sortKey)||{};
  let r;
  if(sortKey==="name") r=dispHandle(a).localeCompare(dispHandle(b));
  else{
    const av=cellVal(a,col), bv=cellVal(b,col);
    const an=typeof av==="number"?av:numv(av), bn=typeof bv==="number"?bv:numv(bv);
    if(an!=null||bn!=null) r=(an==null?-Infinity:an)-(bn==null?-Infinity:bn);
    else r=String(av||"").localeCompare(String(bv||""));
  }
  return sortDir==="desc"?-r:r;
}
function orderedAll(){
  const all=((PAYLOAD&&PAYLOAD.groups[activeTab])||[]).slice();
  if(sortKey) return all.sort(cmp);
  const ord=rowOrder[activeTab];
  if(ord&&ord.length&&!(BRAND&&BRAND.list&&mode!=="team")){
    const pos={}; ord.forEach((id,i)=>pos[id]=i);
    const base={}; all.forEach((c,i)=>base[c.id]=i);
    all.sort((a,b)=>((pos[a.id]??1e6+base[a.id])-(pos[b.id]??1e6+base[b.id])));
  }
  return all;
}
function currentList(){
  const all=(PAYLOAD&&PAYLOAD.groups[activeTab])||[];
  const q=query.trim().toLowerCase();
  let list=orderedAll().filter(c=>!q||[c.name,c.host,c.category,c.handle,c.location,c.state].join(" ").toLowerCase().includes(q));

function sumBy(list,k){ return list.reduce((a,c)=>a+(typeof c[k]==="number"?c[k]:0),0); }
function totalsRow(list,cols){

      case "vg": return vg?int(vg)+`<span class="sub">${long&&!estLong()?"guaranteed views":"estimated views"}</span>`:"";
      case "cpm": return long&&vg?money2(Math.round(rate*100000/vg)/100):"";

// Excel-style column resize: drag a header's right edge; double-click it to reset.
function wireResize(sc){
  const table=sc.querySelector("table"); if(!table) return;
  const colEls=[...table.querySelectorAll("colgroup col")];
  const ths=[...table.querySelectorAll("thead th")];
  sc.querySelectorAll(".rsz").forEach(h=>{
    h.addEventListener("click",e=>e.stopPropagation());
    h.addEventListener("dblclick",e=>{ e.stopPropagation(); delete colWidths[h.dataset.k]; layoutChanged(); render(); });
    h.addEventListener("mousedown",e=>{
      e.preventDefault(); e.stopPropagation();
      const th=h.closest("th"), i=ths.indexOf(th), col=colEls[i]; if(!col) return;
      th.removeAttribute("draggable");
      const startX=e.clientX, startW=th.getBoundingClientRect().width, startT=table.getBoundingClientRect().width;
      let w=startW; h.classList.add("on"); document.body.classList.add("resizing");
      const move=ev=>{ w=Math.max(48,Math.min(1600,Math.round(startW+ev.clientX-startX))); col.style.width=w+"px"; table.style.width=(startT+w-startW)+"px"; };
      const up=()=>{
        document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up);
        h.classList.remove("on"); document.body.classList.remove("resizing"); 
        wireResize.at=Date.now();
        if(Math.abs(w-startW)>=2){ colWidths[h.dataset.k]=w; layoutChanged(); }
      };
      document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
    });
  });
}
function layoutChanged(){
  persistMine();
  if(mode==="team"){ layoutDirty=true; $("#saveCols").style.display=""; }
  $("#resetLayout").style.display="";
}
// Row drag: grab the ⠿ handle. Dropping clears any header sort and keeps this order.
function wireRowDrag(sc){
  let dragId=null;
  const clear=()=>sc.querySelectorAll(".drop-before,.drop-after").forEach(x=>x.classList.remove("drop-before","drop-after"));
  sc.querySelectorAll("tr.chan").forEach(tr=>{
    const grip=tr.querySelector(".grip");
    if(grip){ grip.addEventListener("mousedown",()=>tr.setAttribute("draggable","true")); grip.addEventListener("click",e=>e.stopPropagation()); }
    tr.addEventListener("dragstart",e=>{ if(tr.getAttribute("draggable")!=="true") return; dragId=tr.dataset.id; tr.classList.add("dragging"); try{e.dataTransfer.setData("text/plain",dragId);}catch(_){} });
    tr.addEventListener("dragend",()=>{ tr.setAttribute("draggable","false"); tr.classList.remove("dragging"); clear(); dragId=null; });
    tr.addEventListener("dragover",e=>{ if(!dragId||tr.dataset.id===dragId) return; e.preventDefault(); const r=tr.getBoundingClientRect(); const after=e.clientY-r.top>r.height/2; tr.classList.toggle("drop-after",after); tr.classList.toggle("drop-before",!after); });
    tr.addEventListener("dragleave",()=>tr.classList.remove("drop-before","drop-after"));
    tr.addEventListener("drop",e=>{
      e.preventDefault(); const target=tr.dataset.id; if(!dragId||target===dragId) return;
      const r=tr.getBoundingClientRect(), after=e.clientY-r.top>r.height/2;
      const order=orderedAll().map(c=>c.id);
      order.splice(order.indexOf(dragId),1);
      order.splice(order.indexOf(target)+(after?1:0),0,dragId);
      dragId=null;
      if(isPitch()){ if(listEdit()) saveListOrder(order); return; }
      rowOrder[activeTab]=order; sortKey=null; layoutChanged(); render();
    });
  });
}

  BRAND.groups[activeTab]=prev.slice().sort((a,b)=>pos[a.id]-pos[b.id]); sortKey=null; render();
  const inTab=new Set(order), queue=order.slice();

// Editing a price on a saved list's page: kept on that list only.
function startListEdit(td){
  const f=findListRow(td.dataset.id); if(!f) return;
  const field=td.dataset.edit, r=f.row, isVid=field==="videos";
  const cur=isVid?(r.minVideos||1):field==="vg"?(r.vgPer!=null?r.vgPer:r.vg):(field==="cpm"&&r.videosSet&&r.askCpm?r.askCpm:r[field]);
  const hint=isVid?"Number of videos, for this list only. Clear it to go back to the automatic count."
    :`${field==="vg"?(f.kind==="long"?"Views per video":"Estimated views per post")+", for this list only":"For this list only"}. Clear it to go back to the roster price.`;
  td.innerHTML=`<input type="number" min="${isVid?1:0}"${isVid?' max="50"':""} step="${field==="cpm"?"0.01":"1"}" value="${cur==null?"":cur}" title="${hint}">`;
  const inp=td.querySelector("input"); inp.focus(); inp.select();
  let done=false;
  const finish=async commit=>{ if(done) return; done=true;
    const raw=inp.value.trim(), v=numv(raw);
    if(!commit||(raw!==""&&(v==null||v===cur))||(raw===""&&!(isVid?r.videosSet:r.custom))){ render(); return; }
    if(isVid&&raw!==""&&!(v>=1&&v<=50&&Math.round(v)===v)){ toast("Videos must be a whole number from 1 to 50",true); render(); return; }
    td.classList.add("saving");
    const body={op:"list-price",slug:LIST_SLUG,id:td.dataset.id};
    if(raw===""){ body.clear=true; if(isVid) body.field="videos"; }
    else if(isVid) body.videos=v;
    else { body[field]=v; body.curVg=r.vgPer!=null?r.vgPer:r.vg; body.curCpm=r.askCpm||r.cpm; if(f.kind!=="long") body.curFee=r.fee!=null?r.fee:(r.vg>=250000?7500:r.vg>=100000?5000:3000); }
    try{ const j=await post(body); applyBrand(j); toast(body.clear?(isVid?"Back to the automatic number of videos":"Back to the roster price for this list"):(isVid?"Videos saved for this list only":"Saved for this list only")); }
    catch(e){ toast(e.message,true); render(); }
  };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") finish(true); if(e.key==="Escape") finish(false); });
  inp.addEventListener("blur",()=>finish(true));
  inp.addEventListener("click",e=>e.stopPropagation());
}
// Main rate card safeguards (Tom, 9 Oct 2026): every change to the main rate card is
// confirmed in a small bar first and can be undone straight after. The API also refuses an
// edit that does not say it is for the main rate card, so pages opened before this rule
// cannot change it.
let cbarDone=null;
function confirmBar(html,yes,onYes,onNo){
  const bar=$("#cbar"); $("#cbarText").innerHTML=html; $("#cbarYes").textContent=yes; $("#cbarNo").style.display=onNo===null?"none":"";
  bar.classList.add("on");
  const close=ok=>{ if(cbarDone!==close) return; cbarDone=null; bar.classList.remove("on"); document.removeEventListener("keydown",key,true); (ok?onYes:(onNo||(()=>{})))(); };
  const key=e=>{ if(e.key==="Escape"){ e.preventDefault(); close(false); } if(e.key==="Enter"&&!e.target.closest("input")){ e.preventDefault(); close(true); } };
  if(cbarDone) cbarDone(false);
  cbarDone=close; $("#cbarYes").onclick=()=>close(true); $("#cbarNo").onclick=()=>close(false);
  setTimeout(()=>document.addEventListener("keydown",key,true),0);
  return close;
}
const fmtNum=(field,v)=>v==null||v===""?"automatic":field==="cpm"?money2(v):field==="videos"?String(v):int(v);
const FIELD_NAME={videos:"videos",vg:"view guarantee",cpm:"CPM"};
function changeMain(body,label){
  confirmBar(`<b>${esc(label)}</b><span class="cs">Main rate card. Brands and every list without its own number will see this.</span>`,"Update",
    ()=>save(Object.assign({scope:"roster"},body)), ()=>render());
}
function startEdit(td){
  if(td.querySelector("input")) return;
  if(td.dataset.list){ startListEdit(td); return; }
  const f=findRow(td.dataset.id); if(!f) return;
  // Views are edited per video (a bundle's guarantee is that x the number of videos).
  const field=td.dataset.edit, isVid=field==="videos";
  const cur=!f.row.brand?"":isVid?(f.row.minVideos||1):field==="vg"?(f.row.vgPer!=null?f.row.vgPer:f.row.brand.vg):(f.row.cpm!=null?f.row.cpm:f.row.brand.cpm);
  td.innerHTML=`<input type="number" min="${isVid?1:0}"${isVid?' max="50"':""} step="${field==="cpm"?"0.01":"1"}" value="${cur==null?"":cur}"${isVid?' title="Number of videos brands are quoted. Clear it to go back to the automatic count."':field==="vg"&&f.row.minVideos>1?` title="Views per video. The bundle guarantee is this x ${f.row.minVideos}."`:""}>`;
  const inp=td.querySelector("input"); inp.focus(); inp.select();
  let done=false;
  const finish=commit=>{ if(done) return; done=true;
    const raw=inp.value.trim(), v=numv(raw);
    const who=f.row.name||"This row", base={op:"edit",id:td.dataset.id,show:td.dataset.show==="1"};
    if(isVid&&raw===""){ if(!commit||!f.row.videosSet){ render(); return; } td.classList.add("saving"); changeMain(Object.assign(base,{videos:null}),`${who}: videos ${cur} → automatic`); return; }
    if(!commit||v==null||v===cur){ render(); return; }
    if(isVid&&!(v>=1&&v<=50&&Math.round(v)===v)){ toast("Videos must be a whole number from 1 to 50",true); render(); return; }
    td.classList.add("saving");
    changeMain(Object.assign(base,{[field]:v}),`${who}: ${FIELD_NAME[field]} ${fmtNum(field,cur)} → ${fmtNum(field,v)}`);
  };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") finish(true); if(e.key==="Escape") finish(false); });
  inp.addEventListener("blur",()=>finish(true));
  inp.addEventListener("click",e=>e.stopPropagation());
}

async function post(body){
  const r=await fetch("/api/roster",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body),credentials:"same-origin"});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
async function save(body){
  try{
    const j=await post(body);
    await loadTeam(true);
    if(j&&j.undo){
      const close=confirmBar(`<b>Main rate card updated.</b><span class="cs">${body.override?"Visibility: "+esc(body.override):"Holds until the quarter resets."}</span>`,"Undo",async()=>{
        try{ await post({op:"undo-edit",id:j.undo.id,show:j.undo.show,values:j.undo.values}); await loadTeam(true); toast("Change undone"); }
        catch(e){ toast(e.message,true); }
      },null);
      setTimeout(()=>{ if(cbarDone===close){ cbarDone=null; $("#cbar").classList.remove("on"); } },10000);
    } else toast("Saved");
  }catch(e){ toast(e.message,true); render(); }
}

// ---------- lists ----------
function renderSelbar(){
  const on=mode==="team"&&picked.size>0;
  $("#selbar").classList.toggle("on",on);
  if(!on) return;
  $("#selCount").textContent=picked.size+" selected"+(editingList?" · editing “"+editingList.title+"”":"");
  $("#saveList").textContent=editingList?"Update list":"Save list";
  $("#saveAsNew").style.display=editingList?"":"none";
}
async function saveList(asNew){
  const title=$("#listName").value.trim()||(editingList&&editingList.title)||"";
  if(!title){ toast("Give the list a name first",true); $("#listName").focus(); return; }
  // Keep the on-screen order: tab by tab, as currently sorted.
  const ids=[]; GROUPS.forEach(g=>(TEAM.groups[g.id]||[]).forEach(c=>{ if(picked.has(c.id)) ids.push(c.id); }));
  try{
    const j=await post({op:"save-list",title,ids,slug:asNew?null:(editingList&&editingList.slug)});
    try{ await navigator.clipboard.writeText(j.url); }catch(_){}
    $("#selMsg").innerHTML=`Saved. Link copied: <a href="${esc(j.url)}" target="_blank" style="text-decoration:underline">${esc(j.url.replace(/^https:\/\//,""))}</a>`;
    editingList={slug:j.slug,title};
    await loadTeam(true);
  }catch(e){ toast(e.message,true); }
}
// "Add / remove creators": load a list's creators as ticks on the main roster.
function chooseCreatorsFor(l){
  picked.clear(); l.ids.forEach(id=>picked.add(String(id))); editingList={slug:l.slug,title:l.title};
  $("#listName").value=l.title; setMode("team"); toast("Loaded “"+l.title+"”. Tick or untick creators, then Update list");
}
function renderPanel(){
  const lists=(TEAM&&TEAM.lists)||[];
  $("#panel").innerHTML=`<h3>Saved lists</h3>`+(lists.length?lists.map(l=>`<div class="li">
    <div class="tt">${esc(l.title)}</div>
    <div class="mm">${l.ids.length} creators · ${esc(l.by||"")}${l.updated?" · updated "+esc(l.updated):""}${l.locked?" · prices locked "+esc(fmtDate(l.locked)):""}</div>
    <div class="acts">
      <a class="btn primary" href="/r/${esc(l.slug)}" title="Change this list's videos, views and prices. Nothing else changes.">Open list</a>
      <button class="btn team" data-a="edit" data-s="${esc(l.slug)}" title="Tick or untick who is on this list">Add / remove creators</button>
      <button class="btn" data-a="copy" data-s="${esc(l.slug)}">Copy brand link</button>
      <button class="btn" data-a="del" data-s="${esc(l.slug)}" style="color:var(--hide)">Delete</button>
    </div></div>`).join("")+`<div class="hint"><b>Open list</b> to change a list's videos and prices (only that list changes).<br><b>Add / remove creators</b> to choose who is on it.</div>`:`<div class="empty">No saved lists yet. Tick creators in the DFT view, name the list and save it.</div>`);
  $("#panel").querySelectorAll("button[data-a]").forEach(b=>b.addEventListener("click",async()=>{
    const l=lists.find(x=>x.slug===b.dataset.s); if(!l) return;
    const url=location.origin+"/r/"+l.slug;
    if(b.dataset.a==="copy"){ try{await navigator.clipboard.writeText(url); toast("Link copied");}catch(_){ prompt("Copy this link",url); } }
    if(b.dataset.a==="edit"){ $("#panel").classList.remove("on"); chooseCreatorsFor(l); }
    if(b.dataset.a==="del"){ if(!confirm("Delete “"+l.title+"”? Its link will stop working. (It is archived on monday and can be restored there.)")) return; try{ await post({op:"delete-list",slug:l.slug}); toast("List deleted"); await loadTeam(true); renderPanel(); }catch(e){ toast(e.message,true); } }
  }));
}

// ---------- modes / loading ----------
// On a saved list's page the team gets three views (Tom, 10 Oct 2026): DFT view (the main
// rate card, locked), Edit list (this list's numbers, stages and order) and Brand preview,
// which is always exactly what the brand sees.
function setMode(m){
  const onList=!!(LIST_SLUG&&TEAM&&BRAND&&BRAND.list);
  if(m==="edit"){ mode="brand"; asBrand=false; } else if(m==="brand"){ mode="brand"; asBrand=onList; } else { mode="team"; asBrand=false; }
  PAYLOAD=mode==="team"?TEAM:BRAND;
  $("#vEdit").style.display=onList?"":"none";
  $("#vTeam").classList.toggle("on",mode==="team");
  $("#vEdit").classList.toggle("on",mode!=="team"&&onList&&!asBrand);
  $("#vBrand").classList.toggle("on",mode!=="team"&&(asBrand||!onList));
  renderBanner(); renderTabs(); render();
}
// Campaign lock: a list follows the quarter unless it is locked for a campaign.
function lockButton(){
  const lk=BRAND&&BRAND.list&&BRAND.list.lock;
  return lk
    ?` <button class="btn" id="lockBtn" data-lock="0" title="Go back to updating with each quarter">Locked for this campaign on ${esc(fmtDate(lk.on))} · Unlock</button>`
    :` <button class="btn" id="lockBtn" data-lock="1" title="Keep these prices past the quarter reset, for this campaign">Lock prices for this campaign</button>`;
}
function viewsButton(){
  const est=!!(BRAND&&BRAND.list&&BRAND.list.estViews);
  return ` <button class="btn" id="viewsBtn" data-est="${est?0:1}" title="What brands see as the YouTube views heading on this list">${est?"Showing Estimated Views · use View Guarantee":"Showing View Guarantee · use Estimated Views"}</button>`;
}
const fmtDate=d=>{ const t=new Date(String(d)+"T12:00:00Z"); return isNaN(t)?String(d||""):t.toLocaleDateString("en-US",{day:"numeric",month:"short",year:"numeric"}); };
async function toggleLock(on){
  try{ const j=await post({op:"list-lock",slug:LIST_SLUG,lock:on}); applyBrand(j); toast(on?"Prices locked for this campaign":"Unlocked: this list follows the quarterly prices again"); loadTeam(true).catch(()=>{}); }
  catch(e){ toast(e.message,true); }
}
function renderBanner(){
  const b=$("#banner");
  if(TEAM&&mode==="team"&&LIST_SLUG&&BRAND&&BRAND.list){
    b.className="banner warn"; b.style.display="";
    b.innerHTML=`This is the <b>main rate card</b>, not “${esc(BRAND.list.title)}”. Its numbers are locked here. <button class="bbtn" id="backToList">Back to “${esc(BRAND.list.title)}”</button> <a class="bbtn" href="/">Change the main rate card</a><span class="spacer"></span><a href="/auth/signout" style="text-decoration:underline">Sign out</a>`;
    $("#backToList").onclick=()=>setMode("edit");
  } else if(TEAM&&mode==="team"&&editingList){
    b.className="banner warn"; b.style.display="";
    b.innerHTML=`<span>Choosing creators for <b>“${esc(editingList.title)}”</b>: tick or untick, then press <b>Update list</b>. Prices are locked while you do this.</span> <a class="bbtn" href="/r/${esc(editingList.slug)}">Change “${esc(editingList.title)}”'s numbers</a> <button class="bbtn" id="doneList">Done</button><span class="spacer"></span><a href="/auth/signout" style="text-decoration:underline">Sign out</a>`;
    $("#doneList").onclick=()=>{ picked.clear(); editingList=null; $("#listName").value=""; $("#selMsg").textContent=""; renderBanner(); render(); };
  } else if(TEAM&&asBrand&&BRAND&&BRAND.list&&mode!=="team"){
    b.className="banner list"; b.style.display="";
    b.innerHTML=`<b>Brand preview:</b>&nbsp;exactly what the brand sees. Their buttons do not save here.<span class="hint">Approve or reject each creator, and add a note to tell us why.</span>${packageSummary()}`;
  } else if(TEAM){
    b.className="banner"; b.style.display="";
    b.innerHTML=`Signed in as <b>${esc(TEAM.email)}</b> · ${mode==="team"
      ?"Blue columns are DFT-only. Click an underlined number to change what brands see, or the eye to show or hide a creator. Drag the ⠿ handles to move rows and columns, or a column's edge to resize it."
      :(listEdit()?`<b>“${esc(BRAND.list.title)}” numbers:</b> click an underlined number to change videos, views or prices for this list only. The main rate card and other lists stay as they are. <a class="bbtn" href="/?edit=${encodeURIComponent(LIST_SLUG)}">Add / remove creators</a>`+lockButton()+viewsButton():"Brand preview: exactly what brands see.")}${listEdit()?packageSummary():'<span class="spacer"></span>'}<a href="/auth/signout" style="text-decoration:underline;margin-left:${listEdit()?"14px":"0"}">Sign out</a>`;
    const lb=$("#lockBtn"); if(lb) lb.onclick=()=>toggleLock(lb.dataset.lock==="1");
    const vb=$("#viewsBtn"); if(vb) vb.onclick=async()=>{ const est=vb.dataset.est==="1"; try{ applyBrand(await post({op:"list-label",slug:LIST_SLUG,est})); toast(est?"Brands now see Estimated Views":"Brands now see View Guarantee"); }catch(e){ toast(e.message,true); } };
  } else if(BRAND&&BRAND.list){
    b.className="banner list"; b.style.display="";
    b.innerHTML=`Prepared for you by Digital Fox Talent: <b>${esc(BRAND.list.title)}</b><span class="hint">Approve or reject each creator, and add a note to tell us why.</span>${packageSummary()}`;
  } else b.style.display="none";
}
function renderTabs(){
  const onList=!!(BRAND&&BRAND.list&&mode!=="team");
  const vis=GROUPS.filter(g=>(PAYLOAD.groups[g.id]||[]).length||!(BRAND&&BRAND.list));
  if(!vis.find(g=>g.id===activeTab)&&vis.length) activeTab=vis[0].id;
  // Saved lists (Tom, 6 Oct 2026): platforms with no creators on the list have no tab, and
  // a list on one platform has no tab bar at all. Signed in, each tab of a list with
  // several platforms has an x that takes that platform's creators off the list.
  $("#tabs").style.display=onList&&vis.length<=1?"none":"";
  const canRemove=listEdit()&&vis.length>1;
  $("#tabs").innerHTML=vis.map(g=>`<button class="tab ${g.id===activeTab?"active":""}" data-g="${g.id}">${esc(g.label)}<span class="n">${(PAYLOAD.groups[g.id]||[]).length}</span>${canRemove?`<span class="x" data-g="${g.id}" title="Take ${esc(g.label)} off this list">&times;</span>`:""}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.g; sortKey=null; renderTabs(); render(); $("#scroll").scrollTop=0;});
  $("#tabs").querySelectorAll(".x").forEach(x=>x.onclick=e=>{
    e.stopPropagation();
    if(!x.classList.contains("confirm")){ x.classList.add("confirm"); x.textContent="Remove?"; setTimeout(()=>{ if(x.isConnected){ x.classList.remove("confirm"); x.innerHTML="&times;"; } },4000); return; }
    removeTabFromList(x.dataset.g);
  });
}
async function removeTabFromList(gid){
  const l=((TEAM&&TEAM.lists)||[]).find(x=>x.slug===LIST_SLUG); if(!l) return;
  const drop=new Set((BRAND.groups[gid]||[]).map(c=>String(c.id)));
  const ids=l.ids.map(String).filter(id=>!drop.has(id));
  if(!ids.length) return;
  const label=(GROUPS.find(g=>g.id===gid)||{}).label||"That tab";
  try{
    await post({op:"save-list",title:BRAND.list.title,ids,slug:LIST_SLUG});
    l.ids=ids; await loadBrand(true);
    toast(label+" taken off this list. Add creators back from the DFT view.");
  }catch(e){ toast(e.message,true); }
}
function applyBrand(p){
  BRAND=p; if(!TEAM) applyLayout(p);
  $("#subtitle").textContent=p.list&&p.list.lock
    ?`Prices fixed for this campaign (set ${fmtDate(p.list.lock.on)}) · a selection from our roster`
    :`Rates valid for ${p.quarter} · ${p.list?"a selection from our roster":"updated once a quarter"} · click the arrow beside a channel to see its shows`;
  if(p.list) $("#title").textContent=p.list.title;
  if(mode!=="team"){ PAYLOAD=BRAND; renderBanner(); renderTabs(); render(); }
}
async function loadBrand(bust){
  // bust: signed-in team members on a list page fetch past the edge cache, so they get
  // the copy that marks list-only prices.
  const url=LIST_SLUG?"/api/roster?list="+encodeURIComponent(LIST_SLUG)+(bust?"&t="+Date.now():""):"/api/roster";
  const r=await fetch(url,{headers:{accept:"application/json"}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"Could not load the roster right now.");
  if(bust) loadBrand.busted=true; else if(loadBrand.busted) return; // keep the team copy
  applyBrand(j);
}
async function loadTeam(fresh){
  const r=await fetch("/api/roster?view=team"+(fresh?"&fresh=1":""),{headers:{accept:"application/json"},credentials:"same-origin",cache:"no-store"});
  if(r.status===401) return false;
  if(!r.ok) throw new Error("team view unavailable");
  const first=!TEAM;
  TEAM=await r.json();
  applyLayout(TEAM);
  $("#teamTools").style.display="inline-flex"; $("#signin").style.display="none";
  if(first&&!LIST_SLUG) mode="team";
  if(fresh||(first&&LIST_SLUG)){ try{ await loadBrand(!!LIST_SLUG); }catch(_){} }
  setMode(mode==="brand"&&LIST_SLUG?"edit":mode);
  return true;
}
async function load(){
  const team=loadTeam(false).catch(()=>false);
  try{ await loadBrand(); }
  catch(e){ if(!(await team)){ $("#scroll").innerHTML=`<div class="state"><div>${esc(e.message)}</div></div>`; $("#count").textContent=""; } }
  const signedIn=await team;
  if(!signedIn&&!LIST_SLUG) $("#signin").style.display="";
  const editSlug=new URLSearchParams(location.search).get("edit");
  if(signedIn&&editSlug&&!LIST_SLUG){ const l=((TEAM&&TEAM.lists)||[]).find(x=>x.slug===editSlug); if(l) chooseCreatorsFor(l); history.replaceState(null,"","/"); }
  if(/signin=failed/.test(location.search)) toast("Sign-in did not complete. Please try again.",true);
}

// ---------- toolbar ----------
$("#search").addEventListener("input",e=>{query=e.target.value; render();});
$("#vTeam").addEventListener("click",()=>setMode("team"));
$("#vBrand").addEventListener("click",()=>setMode("brand"));
$("#vEdit").addEventListener("click",()=>setMode("edit"));
$("#listsBtn").addEventListener("click",e=>{e.stopPropagation(); renderPanel(); $("#panel").classList.toggle("on");});
document.addEventListener("click",e=>{ if(!e.target.closest("#panel")&&!e.target.closest("#listsBtn")) $("#panel").classList.remove("on"); });
$("#saveList").addEventListener("click",()=>saveList(false));
$("#saveAsNew").addEventListener("click",()=>saveList(true));
$("#clearSel").addEventListener("click",()=>{picked.clear(); editingList=null; $("#listName").value=""; $("#selMsg").textContent=""; renderBanner(); render();});
$("#resetLayout").addEventListener("click",()=>{
  try{ localStorage.removeItem(LAYOUT_KEY); }catch(e){}
  myLayout=null; layoutDirty=false; sortKey=null; $("#saveCols").style.display="none"; $("#resetLayout").style.display="none";
  applyLayout((mode==="team"?TEAM:BRAND)||{}); render();
});
$("#saveCols").addEventListener("click",async()=>{
  try{ await post({op:"columns",columns:colOrder||BRAND_COLS.map(c=>c.key),rows:rowOrder,widths:colWidths}); layoutDirty=false; $("#saveCols").style.display="none"; toast("Layout saved for everyone"); }
  catch(e){ toast(e.message,true); }
});

function csvEscape(v){ v=(v==null?"":String(v)); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
$("#exportCsv").addEventListener("click",()=>{
  const cols=columns().filter(c=>c.key!=="sel"&&c.key!=="status");
  const header=cols.map(c=>c.key==="name"?"Creator (@handle)":c.head.replace(" ✎",""));
  const rows=currentList().map(c=>cols.map(col=>{
    if(col.key==="name") return dispHandle(c);
    const v=cellVal(c,col);
    if(col.fmt==="money"||col.fmt==="int") return v==null?"":Math.round(v);
    return v==null?"":v;
  }));
  const csv=[header,...rows].map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="dft-roster-"+((GROUPS.find(g=>g.id===activeTab)||{}).label||"roster").toLowerCase().replace(/[^a-z0-9]+/g,"-")+(mode==="team"?"-dft":"")+".csv";
  document.body.appendChild(a); a.click(); a.remove();
});

load();
</script>
